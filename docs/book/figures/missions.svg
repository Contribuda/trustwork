<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 468" role="img" aria-labelledby="missions-title missions-desc">
<title id="missions-title">The seven missions, in three groups</title>
<desc id="missions-desc">Seven numbered tiles. The first row, in blue, holds the three missions for the construction industry: every builder visible; every build clearer and safer; bankable and insurable. The second row, in amber, holds the civic ring: residents decide; public money into concrete; the culture of building. A wide seventh tile, with a green number, is the engine itself: run anywhere, belong to no one.</desc>
<text x="24" y="28" class="ink3" style="font-size:16px">1–3 · the construction industry</text>
<text x="24" y="186" class="ink3" style="font-size:16px">4–6 · the civic ring, one course higher</text>
<text x="24" y="344" class="ink3" style="font-size:16px">7 · the engine itself</text>
<rect x="24" y="40" width="176" height="110" rx="12" class="boxb"/>
<circle cx="50" cy="66" r="16" class="blue"/>
<text x="50" y="72" text-anchor="middle" class="bold onfill" style="font-size:17px">1</text>
<text x="40" y="108" class="bold ink" style="font-size:18px">Every builder</text>
<text x="40" y="132" class="bold ink" style="font-size:18px">visible</text>
<rect x="212" y="40" width="176" height="110" rx="12" class="boxb"/>
<circle cx="238" cy="66" r="16" class="blue"/>
<text x="238" y="72" text-anchor="middle" class="bold onfill" style="font-size:17px">2</text>
<text x="228" y="108" class="bold ink" style="font-size:18px">Every build</text>
<text x="228" y="132" class="bold ink" style="font-size:18px">clearer, safer</text>
<rect x="400" y="40" width="176" height="110" rx="12" class="boxb"/>
<circle cx="426" cy="66" r="16" class="blue"/>
<text x="426" y="72" text-anchor="middle" class="bold onfill" style="font-size:17px">3</text>
<text x="416" y="108" class="bold ink" style="font-size:18px">Bankable and</text>
<text x="416" y="132" class="bold ink" style="font-size:18px">insurable</text>
<rect x="24" y="198" width="176" height="110" rx="12" class="boxa"/>
<circle cx="50" cy="224" r="16" class="amber"/>
<text x="50" y="230" text-anchor="middle" class="bold onamber" style="font-size:17px">4</text>
<text x="40" y="266" class="bold ink" style="font-size:18px">Residents</text>
<text x="40" y="290" class="bold ink" style="font-size:18px">decide</text>
<rect x="212" y="198" width="176" height="110" rx="12" class="boxa"/>
<circle cx="238" cy="224" r="16" class="amber"/>
<text x="238" y="230" text-anchor="middle" class="bold onamber" style="font-size:17px">5</text>
<text x="228" y="266" class="bold ink" style="font-size:18px">Public money</text>
<text x="228" y="290" class="bold ink" style="font-size:18px">into concrete</text>
<rect x="400" y="198" width="176" height="110" rx="12" class="boxa"/>
<circle cx="426" cy="224" r="16" class="amber"/>
<text x="426" y="230" text-anchor="middle" class="bold onamber" style="font-size:17px">6</text>
<text x="416" y="266" class="bold ink" style="font-size:18px">The culture</text>
<text x="416" y="290" class="bold ink" style="font-size:18px">of building</text>
<rect x="24" y="356" width="552" height="60" rx="12" class="box"/>
<circle cx="50" cy="386" r="16" class="green"/>
<text x="50" y="392" text-anchor="middle" class="bold onfill" style="font-size:17px">7</text>
<text x="80" y="393" class="bold ink" style="font-size:20px">Run anywhere, belong to no one</text>
<text x="300" y="452" text-anchor="middle" class="ink3" style="font-size:16px">one record, from the first builder to the whole society</text>
</svg>
