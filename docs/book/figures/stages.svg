<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="stages-title stages-desc">
<title id="stages-title">A house in six gates: evidence, an inspector's act and acceptance release a tranche</title>
<desc id="stages-desc">Six stage boxes stand in a column on the left, from top to bottom: plan, foundation, frame, roof, services, finish. Beside each stage a gate holds three small squares: amber for the builder's field evidence, blue for the independent inspector's act, green for the owner's acceptance. From each closed gate an amber wire runs to a tall box on the right labelled licensed lender, which releases one tranche per gate. Trustwork keeps the records in the middle; the money moves on the right, outside it.</desc>
<rect x="452" y="40" width="128" height="560" rx="14" class="boxa"/>
<text x="516" y="312" text-anchor="middle" class="bold ink" style="font-size:22px">licensed</text>
<text x="516" y="340" text-anchor="middle" class="bold ink" style="font-size:22px">lender</text>
<text x="300" y="30" text-anchor="middle" class="ink3" style="font-size:16px">records on the hub</text>
<text x="516" y="30" text-anchor="middle" class="ink3" style="font-size:16px">money, outside</text>
