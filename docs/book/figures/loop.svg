<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="loop-title loop-desc">
<title id="loop-title">The loop of public trust</title>
<desc id="loop-desc">Ten stations on a circle, clockwise from the top: an idea from residents, discussion and co-design, feasibility and cost by professionals, the vote, a line in an open budget, an open tender, construction with field evidence, confirmation by residents and inspectors, a record and reputation from evidence, and lessons shared, which lead to the next idea. Amber stations belong to residents, violet to the public body, blue to professionals and companies, green to the shared record.</desc>
