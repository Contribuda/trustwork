<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" role="img" aria-labelledby="civic-scores-title civic-scores-desc">
<title id="civic-scores-title">The civic scores of the fourteen countries</title>
<desc id="civic-scores-desc">Fourteen horizontal bars sorted from the highest score to the lowest: Dominican Republic 83, Peru 82, Colombia 80, Philippines 78, United States 77, Kenya 75, Ghana 73, Mexico 73, Armenia 68, Nigeria 66, Georgia 59, Rwanda 57, Uzbekistan 53, Azerbaijan 41. The Dominican Republic's bar is amber and marked first civic pilot. Georgia, Rwanda, Uzbekistan and Azerbaijan are drawn as dashed outlines and marked civic layer paused; the rest are solid blue.</desc>
<text x="184" y="18" class="ink3" style="font-size:16px">civic score, 0 to 100</text>
<text x="172" y="46" text-anchor="end" class="ink" style="font-size:16px">Dominican Republic</text>
