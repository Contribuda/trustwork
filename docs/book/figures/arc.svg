<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="arc-title arc-desc">
<title id="arc-title">The five years: five stations rising</title>
<desc id="arc-desc">Five numbered blue stations rise from left to right along a blue wire, each standing on a thin post above a common baseline, with its year below and one word above: 2027 home, 2028 loop, 2029 module, 2030 federation, 2031 anywhere. In the upper right corner stands the mark: three small blue squares and one place drawn as a dashed open outline.</desc>
<path d="M20 350 L580 350" class="thin"/>
<path d="M70 300 L185 250 L300 200 L415 150 L530 100" class="wire-blue"/>
<path d="M70 324 L70 350" class="thin"/>
<path d="M185 274 L185 350" class="thin"/>
<path d="M300 224 L300 350" class="thin"/>
<path d="M415 174 L415 350" class="thin"/>
<path d="M530 124 L530 350" class="thin"/>
<circle cx="70" cy="300" r="24" class="blue"/>
<text x="70" y="308" text-anchor="middle" class="bold onfill" style="font-size:22px">1</text>
<text x="70" y="262" text-anchor="middle" class="bold ink" style="font-size:20px">home</text>
<text x="70" y="382" text-anchor="middle" class="ink2" style="font-size:20px">2027</text>
<circle cx="185" cy="250" r="24" class="blue"/>
<text x="185" y="258" text-anchor="middle" class="bold onfill" style="font-size:22px">2</text>
<text x="185" y="212" text-anchor="middle" class="bold ink" style="font-size:20px">loop</text>
<text x="185" y="382" text-anchor="middle" class="ink2" style="font-size:20px">2028</text>
<circle cx="300" cy="200" r="24" class="blue"/>
<text x="300" y="208" text-anchor="middle" class="bold onfill" style="font-size:22px">3</text>
<text x="300" y="162" text-anchor="middle" class="bold ink" style="font-size:20px">module</text>
<text x="300" y="382" text-anchor="middle" class="ink2" style="font-size:20px">2029</text>
<circle cx="415" cy="150" r="24" class="blue"/>
<text x="415" y="158" text-anchor="middle" class="bold onfill" style="font-size:22px">4</text>
<text x="415" y="112" text-anchor="middle" class="bold ink" style="font-size:20px">federation</text>
<text x="415" y="382" text-anchor="middle" class="ink2" style="font-size:20px">2030</text>
<circle cx="530" cy="100" r="24" class="blue"/>
<text x="530" y="108" text-anchor="middle" class="bold onfill" style="font-size:22px">5</text>
<text x="530" y="62" text-anchor="middle" class="bold ink" style="font-size:20px">anywhere</text>
<text x="530" y="382" text-anchor="middle" class="ink2" style="font-size:20px">2031</text>
<rect x="20" y="20" width="26" height="26" rx="4" class="open"/>
<rect x="52" y="20" width="26" height="26" rx="4" class="blue"/>
<rect x="20" y="52" width="26" height="26" rx="4" class="blue"/>
<rect x="52" y="52" width="26" height="26" rx="4" class="blue"/>
<text x="92" y="54" text-anchor="start" class="ink3" style="font-size:16px">the open square stays open</text>
</svg>
