<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial office prototype</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--ink:#14181f;--muted:#5b6472;--line:#dde1e7;--band:#1d2a44;--band-ink:#ffffff;
  --accent:#1f5fbf;--accent-ink:#ffffff;--ok:#1d7a46;--warn:#9a5b00;--bad:#b3261e;--lock:#5b4bb7;--chip:#eef1f6;--focus:#f2b705;
  --radius:10px;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1218;--panel:#171b23;--ink:#e8ebf0;--muted:#a3abb8;--line:#2a303b;--band:#0b1322;--chip:#222836;--accent:#5b9bff;--accent-ink:#0b1322;--ok:#4cc38a;--warn:#e0a94a;--bad:#ff8a80;--lock:#a99cff}
}
:root[data-theme="dark"]{--bg:#0f1218;--panel:#171b23;--ink:#e8ebf0;--muted:#a3abb8;--line:#2a303b;--band:#0b1322;--chip:#222836;--accent:#5b9bff;--accent-ink:#0b1322;--ok:#4cc38a;--warn:#e0a94a;--bad:#ff8a80;--lock:#a99cff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--panel);padding:8px;z-index:10}
.skip:focus{left:8px}
.band{background:var(--band);color:var(--band-ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.band strong{font-weight:650}
.band .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.band select,.band button{font:inherit;font-size:13px;background:transparent;color:var(--band-ink);border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:4px 8px}
.band option{color:#14181f}
.demo{background:#fff4d6;color:#4a3500;padding:6px 16px;font-size:13px;border-bottom:1px solid #f0d58a}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 90px)}
nav.side{border-right:1px solid var(--line);background:var(--panel);padding:12px 8px;overflow:auto}
nav.side h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 10px 6px}
nav.side button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:7px 10px;border-radius:8px;font:inherit;cursor:pointer}
nav.side button[aria-current="page"]{background:var(--chip);font-weight:650}
nav.side .count{font-size:12px;background:var(--chip);border-radius:999px;padding:0 7px;color:var(--muted)}
.navtoggle{display:none}
main{padding:18px 22px;max-width:1200px;width:100%}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14px;margin:12px 0 6px}
.tile .n{font-size:26px;font-weight:700}
.tile .l{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
.output-review{table-layout:fixed}.output-review th,.output-review td{overflow-wrap:anywhere}.output-review .chip{white-space:normal}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;margin:1px 2px 1px 0;white-space:nowrap}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .lock{color:var(--lock)}
.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.chip.lock{background:color-mix(in srgb,var(--lock) 14%,transparent)}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.note{font-size:13px;color:var(--muted)}
.locked{border:1px dashed var(--lock);border-radius:8px;padding:8px 10px;color:var(--lock);font-size:13px}
.blocker{border-left:3px solid var(--bad);padding:4px 10px;margin:6px 0;background:color-mix(in srgb,var(--bad) 6%,transparent)}
.okline{border-left:3px solid var(--ok);padding:4px 10px;margin:6px 0;background:color-mix(in srgb,var(--ok) 6%,transparent)}
.warnline{border-left:3px solid var(--warn);padding:4px 10px;margin:6px 0;background:color-mix(in srgb,var(--warn) 6%,transparent)}
.side-by-side{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{padding:6px 8px;border-radius:6px;margin:4px 0;border:1px solid var(--line)}
.seg.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
mark{background:color-mix(in srgb,var(--focus) 40%,transparent);color:inherit;padding:0 2px;border-radius:3px}
del{color:var(--bad)} ins{color:var(--ok);text-decoration:none;background:color-mix(in srgb,var(--ok) 12%,transparent)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix .chip{white-space:normal}
.matrix select{font:inherit;font-size:13px;padding:3px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:150px}
.bar{height:8px;background:var(--chip);border-radius:999px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent)}
.toast{pointer-events:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;max-width:92vw;display:none;z-index:20}
.drawer{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.tabs{display:none;gap:6px;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .day{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:6px;font-size:12px}
.cal .day b{display:block;font-size:12px;color:var(--muted)}
.slot{display:block;border-radius:6px;padding:3px 5px;margin:3px 0;background:var(--chip)}
.slot.empty{border:1px dashed var(--warn);background:transparent}
.byline{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.list-cal{display:none}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0}
@media (max-width: 900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
}
@media (max-width: 767px){
  .layout{grid-template-columns:1fr}
  nav.side{display:none;border-right:0;border-bottom:1px solid var(--line)}
  nav.side.open{display:block}
  .navtoggle{display:inline-block}
  main{padding:14px 16px}
  .g2,.side-by-side{grid-template-columns:1fr}
  .hide-sm{display:none}
  table.cards thead{display:none}
  table.cards tr{display:block;border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:6px;background:var(--panel)}
  table.cards td{display:block;border:0;padding:3px 4px}
  table.cards td[data-label]::before{content:attr(data-label) ": ";color:var(--muted);font-size:12px}
  .cal{display:none}
  .list-cal{display:block}
  .tabs{display:flex}
  .wide-only{display:none}
}
/* Language picker: inherits the header's colour; the menu uses --lp-bg / --lp-ink / --lp-line / --lp-accent */
.lp{position:relative;display:inline-block}
.lp-btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 10px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.lp-btn .lp-ico{flex:none;opacity:.85}
.lp-btn:focus-visible,.lp-opt:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.lp-pop{position:absolute;top:calc(100% + 6px);right:0;z-index:200;width:max-content;min-width:220px;max-width:calc(100vw - 32px);padding:6px;border-radius:10px;border:1px solid var(--lp-line,#d0d5dd);background:var(--lp-bg,#fff);color:var(--lp-ink,#14181f);box-shadow:0 10px 28px rgba(0,0,0,.18);text-align:left}
.lp-pop[hidden]{display:none}
.lp-opt{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;width:100%;min-height:36px;padding:6px 10px 6px 6px;border:0;border-radius:6px;background:transparent;color:inherit;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.lp-opt:hover{background:color-mix(in srgb,var(--lp-accent,#1f5fd6) 10%,transparent)}
.lp-opt[aria-pressed="true"]{font-weight:650}
.lp-check{display:inline-block;width:14px;flex:none;color:var(--lp-accent,#1f5fd6)}
.lp-note{flex-basis:100%;padding-left:22px;font-size:11.5px;font-weight:400;opacity:.75}

main{min-width:0} @media(max-width:600px){.side-by-side{grid-template-columns:1fr}.chip{white-space:normal}main{padding:14px}table{display:block;overflow:auto;max-width:100%}}
@media(max-width:600px){.grid,.grid>*{min-width:0}.kv{grid-template-columns:minmax(0,1fr)}.kv dd{margin:0;min-width:0}code{overflow-wrap:anywhere}.btn{white-space:normal;max-width:100%;min-height:44px}}
@media(max-width:600px){dl.kv{grid-template-columns:minmax(0,1fr)}dl.kv dd,.card{overflow-wrap:anywhere}}
</style>
</head>
<body>
<a href="#main" class="skip" id="skip">Skip to content</a>
<header class="band" role="banner">
  <div><strong id="brandLine">Administration · Trustwork United States (demo) · San Diego</strong></div>
  <div class="meta">
    <button class="navtoggle" id="navToggle" aria-expanded="false" aria-controls="sideNav">Menu</button>
    <label><span id="personaLabel">Signed in as</span>
      <select id="persona" aria-label="Persona">
        <option value="ed">Synthetic Editor A (editor)</option>
        <option value="eic">Synthetic Editor-in-chief B (editor-in-chief)</option>
        <option value="ed2">Synthetic Editor F (editor)</option>
        <option value="tr">Synthetic Reviewer C (translator-reviewer, es)</option>
        <option value="au">Synthetic Auditor D (auditor)</option>
      </select>
    </label>
    <span id="langPicker"></span>
    <button id="themeBtn" aria-label="Theme">◐</button>
  </div>
</header>
<div class="demo" id="demoBand" role="note">Demo prototype with synthetic data. No real people, companies, sources or traffic. Changes are not saved. Status: Proposed design.</div>
<div class="layout">
  <nav class="side" id="sideNav" aria-label="Editorial office"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function reasonField(id){ return '<label class="note" for="' + id + '">' + esc(tt('Reason (required, recorded in the audit log)','Причина (обязательно, записывается в журнал аудита)')) + '</label><br><input id="' + id + '" style="width:100%;max-width:520px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)" value="' + esc(tt('Synthetic demo reason','Синтетическая причина для демо')) + '">'; }

function tile(n,l){ return '<div class="card tile"><div class="n">' + num(n) + '</div><div class="l">' + esc(l) + '</div></div>'; }
function qrow(name,n,age,goTo){ return '<tr><td data-label="' + esc(tt('Queue','Очередь')) + '"><button class="btn" data-go="' + goTo + '">' + esc(name) + '</button></td><td data-label="' + esc(tt('Waiting','Ожидают')) + '">' + num(n) + '</td><td data-label="' + esc(tt('Oldest','Самый старый')) + '">' + esc(age) + '</td></tr>'; }
function meter(v,cap){ var p = Math.min(100, Math.round(v/cap*100)); return '<p>' + money(v) + ' ' + tt('of','из') + ' ' + money(cap) + ' (' + p + '%)</p><div class="bar" aria-hidden="true"><span style="width:' + p + '%"></span></div>'; }

document.addEventListener('click', function(e){

  if (t.dataset.go) { go(t.dataset.go); return; }

  if (t.dataset.out) { S.reviewQueue.forEach(function(o){ if (o.id===t.dataset.out) o.state = t.dataset.v; }); renderNav(); render(); demoSaved(tt('Decision recorded','Решение записано')); return; }
  var a = t.dataset.act; if (!a) return;
  switch(a){
    case 'killall': ROLE_DEFS.forEach(function(r){ S.roles[r[0]].killed = true; }); demoSaved(tt('Team stopped at the next step boundary','Команда остановлена на границе следующего шага')); break;
    case 'recheck': demoSaved(tt('Legal checks queued; terms remain unclear until a person records the review','Юридические проверки поставлены в очередь; условия остаются неясными до записи проверки человеком')); break;
    case 'takedown': demoSaved(tt('Takedown requires a reason; tombstones would reach indexes, TM and peers','Снятие требует причины; надгробия дойдут до индексов, TM и пиров')); break;
    case 'dryrun-fakes': S.dryRun = 'fakes'; render(); toast(tt('Dry run finished: nothing committed','Пробный запуск завершён: ничего не записано')); return;
    case 'dryrun-models': S.dryRun = 'models'; render(); toast(tt('Dry run with models on 5 samples: ','Пробный запуск с моделями на 5 образцах: ') + money(0.38)); return;
    case 'activate-job': demoSaved(tt('Version 3 activated by ','Версия 3 активирована: ') + personaName(persona)); break;
    case 'release-q': demoSaved(tt('Opened as data: the text is shown inert and cannot trigger anything','Открыто как данные: текст показан инертно и ничего не может запустить')); break;
    case 'fix-claims': S.claimsFixed = true; render(); demoSaved(tt('Claims c3 and c4 removed (new draft version)','Утверждения c3 и c4 удалены (новая версия черновика)')); return;
    case 'fix-seg': S.translation.fixed = true; render(); demoSaved(); return;
    case 'approve-ed': S.translation.state = 'approved'; render(); demoSaved(tt('Edition approved by ','Редакция одобрена: ') + personaName(persona)); return;
    case 'first-approve': S.pub.firstReview = persona; S.pub.state = 'awaiting_second'; renderNav(); render(); toast(tt('First review recorded. A second editor must approve in Approvals.','Первая проверка записана. Второй редактор должен одобрить в «Согласованиях».')); return;
    case 'second-approve': S.pub.secondReview = persona; S.pub.state = 'approved'; renderNav(); render(); demoSaved(tt('Second review recorded','Вторая проверка записана')); return;
    case 'second-return': case 'return': S.pub.state = 'in_review'; S.pub.firstReview = null; renderNav(); render(); demoSaved(tt('Returned with note','Возвращено с замечанием')); return;
    case 'publish-now': S.pub.state = 'published'; renderNav(); render(); demoSaved(tt('Published by the content module on your decision','Опубликовано модулем контента по вашему решению')); return;
    case 'schedule': S.pub.scheduled = true; render(); demoSaved(); return;
    case 'publish-correction': S.correction.published = true; S.correction.kind = 'correction'; renderNav(); render(); demoSaved(); return;
    case 'pause-role': var r1 = S.roles[S.selRole||'translator']; r1.paused = !r1.paused; render(); demoSaved(); return;
    case 'kill-role': S.roles[S.selRole||'translator'].killed = true; render(); demoSaved(tt('Role stopped','Роль остановлена')); return;
    case 'request-autonomy': S.pendingAutonomy = {by: persona, label: tt('Translator · machine translation of approved pieces → auto-publish allowed (E3)','Переводчик · машинный перевод одобренных материалов → автопубликация разрешена (E3)'), diff: tt('autonomy: auto with review → auto-publish allowed; standing policy "MT en→es" draft → active, expires 2027-01-30; cap 20 items/day','автономия: авто с проверкой → автопубликация разрешена; политика «MT en→es» черновик → активна, истекает 2027-01-30; лимит 20 материалов/день')}; renderNav(); render(); toast(tt('Request sent to Approvals. You cannot approve it yourself.','Запрос отправлен в «Согласования». Вы не можете одобрить его сами.')); return;
    case 'autonomy-approve': S.policyActive = true; S.roles.translator.autonomy.translation = 'autoPublish'; S.pendingAutonomy = null; renderNav(); render(); demoSaved(tt('Second person approved','Второе лицо одобрило')); return;
    case 'autonomy-decline': S.pendingAutonomy = null; renderNav(); render(); demoSaved(); return;
    case 'retry-run': demoSaved(tt('New run r-1043 linked to r-1037','Новый запуск r-1043 связан с r-1037')); break;
    case 'cap': demoSaved(); break;
  }
  render();
});
document.addEventListener('change', function(e){
  if (e.target.id === 'roleSel') { S.selRole = e.target.value; render(); return; }
  if (e.target.dataset && e.target.dataset.aut) {
    var rid = S.selRole || 'translator';
    if (e.target.value === 'autoPublish') { e.target.value = S.roles[rid].autonomy[e.target.dataset.aut] || 'off'; toast(tt('Use "Sign and request activation": auto-publish needs a standing policy and a second person.','Используйте «Подписать и запросить активацию»: автопубликации нужны постоянная политика и второе лицо.')); return; }
    S.roles[rid].autonomy[e.target.dataset.aut] = e.target.value; demoSaved(tt('New settings version drafted','Создана новая версия настроек'));
  }
});
L10N.mount(document.getElementById('langPicker')); L10N.onChange(function(next){lang=next;renderNav();render();});
document.getElementById('persona').addEventListener('change', function(e){ persona = e.target.value; render(); toast(tt('Persona: ','Персона: ') + personaName(persona)); });
document.getElementById('themeBtn').addEventListener('click', function(){ var r = document.documentElement; var cur = r.getAttribute('data-theme'); var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; r.setAttribute('data-theme', dark ? 'light' : 'dark'); });
document.getElementById('navToggle').addEventListener('click', function(){ var n = document.getElementById('sideNav'); var open = n.classList.toggle('open'); this.setAttribute('aria-expanded', open ? 'true' : 'false'); });
renderNav(); render();
})();
</script>
