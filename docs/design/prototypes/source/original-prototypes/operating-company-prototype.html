<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Operating Company</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14171c;--muted:#5a6270;--line:#d9dde3;--brand:#1f5fd6;--brand-ink:#fff;--ok:#1d7a46;--warn:#9a5b00;--bad:#b42318;--chip:#eef2f8;--lock:#f3f0e8;--agent:#efe9fb;--agent-ink:#4b2c8f;--focus:#ffbf47}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1216;--panel:#171b21;--ink:#e8ebf0;--muted:#a3abb8;--line:#2c333d;--brand:#6c9cff;--brand-ink:#0b0e12;--ok:#5cc28a;--warn:#e0a84a;--bad:#ff7a6e;--chip:#222934;--lock:#2a2720;--agent:#2a2340;--agent-ink:#c9b6ff}}
:root[data-theme="dark"]{--bg:#0f1216;--panel:#171b21;--ink:#e8ebf0;--muted:#a3abb8;--line:#2c333d;--brand:#6c9cff;--brand-ink:#0b0e12;--ok:#5cc28a;--warn:#e0a84a;--bad:#ff7a6e;--chip:#222934;--lock:#2a2720;--agent:#2a2340;--agent-ink:#c9b6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Georgian","Noto Sans Armenian",sans-serif}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.band{background:#5a3e00;color:#fff;padding:6px 16px;font-size:13px}
.mt{background:var(--chip);color:var(--muted);padding:4px 16px;font-size:12px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.sq{display:inline-grid;grid-template-columns:repeat(3,8px);gap:2px}.sq i{width:8px;height:8px;background:var(--brand);display:block}
.acts{color:var(--muted);font-size:13px}
.hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button,input{font:inherit}
select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 120px)}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px}
nav.side h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 8px 6px}
nav.side button{display:block;width:100%;text-align:start;padding:8px 10px;border:0;background:none;color:var(--ink);border-radius:6px;cursor:pointer}
nav.side button[aria-current="page"]{background:var(--chip);font-weight:600}
main{padding:18px 20px;max-width:1100px;width:100%}
h1{font-size:22px;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 16px}
.status{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-inline-start:8px;vertical-align:middle;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.kpi .v{font-size:22px;font-weight:700}.kpi .l{color:var(--muted);font-size:13px}.kpi .s{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn.sec{background:transparent;color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px}
.agent{background:var(--agent);color:var(--agent-ink)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.lock{background:var(--lock);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px}
.lock b{margin-inline-end:6px}
table{border-collapse:collapse;width:100%}
th,td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 14px}
.steps li{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps li[aria-current="step"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.steps li.done{color:var(--ok)}
ul.tree,ul.tree ul{list-style:none;margin:0;padding-inline-start:18px;border-inline-start:2px solid var(--line)}
ul.tree{padding-inline-start:0;border:0}
ul.tree li{margin:6px 0}
.node{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.icon{width:16px;height:16px;display:inline-block;border-radius:3px;background:var(--agent-ink);opacity:.8;transform:rotate(45deg) scale(.7)}
.pic{width:16px;height:16px;display:inline-block;border-radius:50%;background:var(--brand)}
.muted{color:var(--muted)}
.label-ai{font-size:12px;color:var(--agent-ink)}
.toggle{display:flex;gap:4px}
.toggle button{padding:4px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--chip);font-weight:600}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:8px 12px}
legend{font-weight:600;padding:0 4px}
label{display:inline-flex;gap:6px;align-items:center;margin:4px 12px 4px 0}
.alert{border-inline-start:4px solid var(--bad);background:var(--panel);padding:8px 12px;margin:8px 0}
.note{border-inline-start:4px solid var(--brand);background:var(--panel);padding:8px 12px;margin:8px 0}
.navsel{display:none;margin:8px 16px}.navsel select{max-width:100%}
@media (max-width:820px){.navsel label{display:block}.layout{grid-template-columns:1fr}nav.side{display:none}.navsel{display:block}main{padding:12px 16px}
 table.resp thead{display:none} table.resp tr{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:4px}
 table.resp td{display:flex;justify-content:space-between;gap:12px;border:0}
 table.resp td::before{content:attr(data-h);color:var(--muted);font-size:12px} td.num{text-align:end}}
</style>
</head>

    <div class="acts" id="actsOn"></div>

    <select id="lang"></select>
    <select id="theme" aria-label="Theme"><option value="">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select>
  </div>
</header>
<div class="navsel"><label for="navsel" id="navselLabel"></label> <select id="navsel"></select></div>
<div class="layout">
  <nav class="side" aria-label="Console" id="sidenav"></nav>
  <main id="main" tabindex="-1"></main>
</div>

/* ===== Synthetic data ===== */
const PRESETS=[['solo',1,0,23],['pair',2,300,23],['small',5,800,23],['assoc',4,400,23],['pub',6,1200,23],['reg',8,600,23]];
const ROLES_PER_FN={lead:1,strat:1,edit:19,mkt:7,outr:12,cmty:5,sales:4,sup:3,tns:4,comp:4,fin:6,legal:4,people:5,qual:4,cult:3,res:3,events:3,loc:4,data:2,ops:4,proc:1,anl:3,fed:1};
const OP='Rosa Delgado (operator)';
const state={lang:'en',view:'journey',step:0,preset:'pair',applied:false,second:false,org:false,h:0,duties:{onb:'shadow',champ:'take',ans:'sup'},bad:false};
try{const l=localStorage.getItem('tw-proto-lang');if(l&&S[l])state.lang=l;}catch(e){}

function tag(){return LANGS.find(x=>x[0]===state.lang)[2]}
function t(k,v){let s=(S[state.lang][k]??S.en[k]??k);if(v)for(const [a,b] of Object.entries(v))s=s.split('{'+a+'}').join(b);return s}
const money=(n)=>new Intl.NumberFormat(tag(),{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
const num=(n,d=0)=>new Intl.NumberFormat(tag(),{maximumFractionDigits:d,minimumFractionDigits:d}).format(n);
const date=(d)=>new Intl.DateTimeFormat(tag(),{dateStyle:'medium'}).format(d);
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const totalRoles=()=>Object.values(ROLES_PER_FN).reduce((a,b)=>a+b,0);
function lock(k){return `<div class="lock" role="note"><b>&#128274; ${t('alwaysOn')}</b>${t(k)}</div>`}

const NAV=[['grpStart',[['journey','navJourney']]],['grpTeam',[['team','navTeam'],['handover','navHandover']]],['grpFunctions',[['finance','navFinance'],['marketing','navMarketing'],['quality','navQuality']]]];
function renderChrome(){
  document.documentElement.lang={uz:'uz-Latn',az:'az-Latn'}[state.lang]||state.lang;
  document.getElementById('synthetic').textContent=t('synthetic');
  const mt=document.getElementById('mtnote');mt.hidden=state.lang==='en';mt.textContent=t('mtNote');
  document.getElementById('brand').textContent=t('brand');
  document.getElementById('consoleTitle').textContent=t('consoleTitle');
  document.getElementById('actsOn').textContent=t('actsOn',{hub:t('hub')});
  document.getElementById('langLabel').textContent=t('langLabel');
  document.getElementById('navselLabel').textContent=t('navLabel');
  const sel=document.getElementById('lang');sel.innerHTML=LANGS.map(([k,n])=>`<option value="${k}" lang="${k}"${k===state.lang?' selected':''}>${n}</option>`).join('');
  document.getElementById('sidenav').innerHTML=NAV.map(([g,items])=>`<h2>${t(g)}</h2>`+items.map(([v,k])=>`<button data-view="${v}"${state.view===v?' aria-current="page"':''}>${t(k)}</button>`).join('')).join('');
  document.getElementById('navsel').innerHTML=NAV.flatMap(([g,items])=>items.map(([v,k])=>`<option value="${v}"${state.view===v?' selected':''}>${t(k)}</option>`)).join('');
}
function head(title,lede){return `<h1>${title}<span class="status">${t('proposed')}</span></h1><p class="lede">${lede}</p>`}

function vJourney(){
  const steps=['st0','st1','st2','st3','st4'];
  let h=head(t('jTitle'),t('jLede'))+`<ol class="steps" aria-label="${t('jTitle')}">`+steps.map((s,i)=>`<li${i===state.step?' aria-current="step"':''} class="${i<state.step?'done':''}">${i+1}. ${t(s)}</li>`).join('')+'</ol><div class="card">';
  if(state.step===0){h+=`<h2>${t('st0')}</h2><table class="resp"><tbody>`+['e0','e1','e2','e3','e4','e5'].map((k,i)=>`<tr><td data-h="">${i<2?'&#10003;':'&#9675;'} ${t(k)}</td><td data-h="" class="muted">${i<2?t('eChecked'):t('eYours')}</td></tr>`).join('')+'</tbody></table>'}
  if(state.step===1){h+=`<h2>${t('st1')}</h2><p>&#10003; ${t('w0')}</p><p>${t('w1')}</p>`}
  if(state.step===2){
    h+=`<h2>${t('pickPreset')}</h2><div class="grid" role="radiogroup" aria-label="${t('pickPreset')}">`+PRESETS.map(([k,p,c])=>`<label class="card" style="display:block;margin:0"><input type="radio" name="preset" value="${k}"${state.preset===k?' checked':''}> <b>${t('p_'+k)}</b><br><span class="muted">${t('p_'+k+'_d')}</span><br><span class="chip">${t('people',{n:num(p)})}</span> <span class="chip">${t('cap',{v:money(c)})}</span></label>`).join('')+'</div>';
    h+=`<p class="row" style="margin-top:10px"><button class="btn" id="apply">${t('apply')}</button></p>`;
    if(state.applied)h+=`<div class="note" role="status">${t('applied',{n:num(totalRoles()),f:num(23)})}<br><span class="label-ai">${t('demoModel')}</span></div>`;
  }
  if(state.step===3){h+=`<h2>${t('st3')}</h2><p>${t('s3body')}</p>`+lock('lk_agents')+(state.second?`<div class="note" role="status">&#10003; ${t('s3done')}</div>`:`<button class="btn" id="second">${t('s3invite')}</button>`)}
  if(state.step===4){h+=`<h2>${t('s4brief')}</h2><span class="chip agent">${t('agentTag')}</span><ul><li>${t('b0',{n:num(4)})}</li><li>${t('b1')}</li><li>${t('b2',{v:money(184)})}</li><li>${t('b3',{n:num(3)})}</li></ul>`}
  h+=`</div><p class="row"><button class="btn sec" id="back"${state.step===0?' disabled':''}>${t('back')}</button><button class="btn" id="next"${state.step===4?' disabled':''}>${t('next')}</button></p>`;
  return h;
}
function owner(k){if(state.second&&['tns','sup','comp','ops','data'].includes(k))return 'Dana Ortiz';if(k==='edit')return OP;return OP}
function vTeam(){
  let h=head(t('tTitle'),t('tLede'))+`<div class="toggle" role="group" aria-label="${t('tTitle')}"><button id="vg" aria-pressed="${!state.org}">${t('viewGrid')}</button><button id="vo" aria-pressed="${state.org}">${t('viewOrg')}</button></div><p class="muted">${t('concentration',{n:num(state.second?18:23)})}</p>`;
  const hireFor={sup:'hireR_sup',cmty:'hireR_cmty',fin:'hireR_fin'};
  if(!state.org){h+='<div class="grid">'+FN_KEYS.map(k=>`<div class="card" style="margin:0"><b>${t('f_'+k)}</b><div class="muted">${t('owner',{name:owner(k)})}</div><div class="row" style="margin-top:6px"><span class="chip agent">${t('agentsN',{n:num(ROLES_PER_FN[k])})}</span><span class="chip">${t('peopleN',{n:num(k==='cmty'&&state.h>=5?1:0)})}</span></div>${hireFor[k]?`<div class="warn" style="font-size:13px;margin-top:6px">${t('hire',{r:t(hireFor[k])})}</div>`:''}</div>`).join('')+'</div>'}
  else{h+=`<ul class="tree"><li><span class="node"><span class="pic" aria-hidden="true"></span>${esc(OP)} <span class="chip">${t('hubOwner')}</span></span><ul>`+FN_KEYS.map(k=>{
    const subs=k==='cmty'?[[t('r_onb'),1],[t('r_champ'),1],[t('r_ans'),1]]:[];
    return `<li><span class="node"><b>${t('f_'+k)}</b> <span class="muted">${t('owner',{name:owner(k)})}</span></span>`+(k==='cmty'?`<ul><li><span class="node"><span class="pic" aria-hidden="true"></span>${state.h>=5?'Sam Lee':t('vacant')} <span class="chip">${t('personTag')}</span> ${t('posCmty')}</span></li>`+subs.map(s=>`<li><span class="node"><span class="icon" aria-hidden="true"></span>${s[0]} <span class="chip agent">${t('agentTag')}</span></span></li>`).join('')+'</ul>':`<ul><li><span class="node"><span class="icon" aria-hidden="true"></span><span class="chip agent">${t('agentsN',{n:num(ROLES_PER_FN[k])})}</span></span></li></ul>`)+'</li>'}).join('')+'</ul></li></ul>'}
  h+=lock('lk_agents');return h;
}
function vHandover(){
  const st=['h0','h1','h2','h3','h4','h5'];
  let h=head(t('hTitle'),t('hLede'))+`<ol class="steps">`+st.map((s,i)=>`<li${i===state.h?' aria-current="step"':''} class="${i<state.h?'done':''}">${i+1}. ${t(s)}</li>`).join('')+'</ol><div class="card">';
  const duties=[['onb','r_onb'],['champ','r_champ'],['ans','r_ans']];
  if(state.h===0){h+=`<p><b>${t('invitee')}:</b> Sam Lee (sam.lee@example.org)</p><p><b>${t('position')}:</b> ${t('posCmty')}</p><p class="muted">${t('rolesNeeded')}</p><button class="btn" id="hn">${t('sendInvite')}</button>`}
  if(state.h===1){h+=`<p class="ok">&#10003; ${t('accepted')}</p>`+duties.map(([k,r])=>`<fieldset><legend>${t(r)} <span class="chip agent">${t('agentTag')}</span></legend>`+['shadow','sup','take'].map(c=>`<label><input type="radio" name="d_${k}" value="${c}"${state.duties[k]===c?' checked':''}>${t({shadow:'c_shadow',sup:'c_sup',take:'c_take'}[c])}</label>`).join('')+'</fieldset>').join('')+`<button class="btn" id="hn">${t('next')}</button>`}
  if(state.h===2){h+=`<table class="resp"><thead><tr><th>${t('diffWhat')}</th><th>${t('before')}</th><th>${t('after')}</th></tr></thead><tbody>`+duties.map(([k,r])=>{const c=state.duties[k];return `<tr><td data-h="${t('diffWhat')}"><b>${t(r)}</b>: ${t('d_rev')}</td><td data-h="${t('before')}">${esc(OP)}</td><td data-h="${t('after')}">${c==='shadow'?esc(OP):'Sam Lee'}</td></tr><tr><td data-h="${t('diffWhat')}">${t('d_acc')}</td><td data-h="${t('before')}">${esc(OP)}</td><td data-h="${t('after')}">${c==='take'?'Sam Lee':esc(OP)}</td></tr><tr><td data-h="${t('diffWhat')}">${t('d_aut')}</td><td data-h="${t('before')}">${t('draft')}</td><td data-h="${t('after')}">${c==='take'?t('observe'):t('draft')}</td></tr>`}).join('')+`<tr><td data-h="${t('diffWhat')}">${t('d_gr')}</td><td data-h="${t('before')}">—</td><td data-h="${t('after')}">${t('unchanged')}</td></tr></tbody></table><p>${t('items',{n:num(7)})}</p><button class="btn" id="hn">${t('next')}</button>`}
  if(state.h===3){h+=`<p>${t('needSecond')}</p><button class="btn" id="hn">${t('confirm')}</button>`}
  if(state.h===4){h+=`<p><b>${t('shadowDays',{n:num(10)})}</b></p><div class="note">${t('practice')}</div><p class="muted">${t('practiceDemo')}</p><button class="btn" id="hn">${t('cutover')}</button>`}
  if(state.h===5){const d=new Date(2026,11,10);h+=`<div class="note" role="status">&#10003; ${t('done',{d:date(d)})}</div><button class="btn sec" id="hr">${t('restart')}</button>`}
  h+='</div>'+lock('lk_agents');return h;
}
function vFinance(){
  const f=[[new Date(2026,10,3),'fl0','src_prov',4200,'stRec'],[new Date(2026,10,5),'fl1','src_prov',-1350,'stWait'],[new Date(2026,10,6),'fl2','src_prov',-49,'stUnk'],[new Date(2026,10,1),'fl3','src_meter',-212,'stRec']];
  let h=head(t('fiTitle'),t('fiLede'))+lock('lk_money')+`<div class="kpis">`+[[money(4200),'k_rec','src_prov'],[num(1),'k_pay','src_prov'],[num(1),'k_unrec','src_prov'],[money(212),'k_model','src_meter']].map(([v,l,s])=>`<div class="card kpi"><div class="v">${v}</div><div class="l">${t(l)}</div><div class="s">${t(s)}</div></div>`).join('')+'</div>';
  h+=`<div class="card"><h2>${t('flows')}</h2><table class="resp"><thead><tr><th>${t('col_date')}</th><th>${t('col_desc')}</th><th>${t('col_src')}</th><th class="num">${t('col_amt')}</th><th>${t('col_state')}</th></tr></thead><tbody>`+f.map(r=>`<tr><td data-h="${t('col_date')}">${date(r[0])}</td><td data-h="${t('col_desc')}">${t(r[1])}</td><td data-h="${t('col_src')}">${t(r[2])}</td><td data-h="${t('col_amt')}" class="num">${money(r[3])}</td><td data-h="${t('col_state')}" class="${r[4]==='stUnk'?'warn':r[4]==='stRec'?'ok':''}">${t(r[4])}</td></tr>`).join('')+`</tbody></table><p class="label-ai">${t('prepared')}</p><p class="muted">${t('release')}</p></div>`;
  const b=[['edit',400,212],['mkt',150,96],['sup',120,41],['fin',80,38],['cmty',80,22]];
  h+=`<div class="card"><h2>${t('budget')}</h2><table class="resp"><thead><tr><th>${t('col_fn')}</th><th class="num">${t('col_cap')}</th><th class="num">${t('col_used')}</th></tr></thead><tbody>`+b.map(r=>`<tr><td data-h="${t('col_fn')}">${t('f_'+r[0])}</td><td data-h="${t('col_cap')}" class="num">${money(r[1])}</td><td data-h="${t('col_used')}" class="num">${money(r[2])} (${num(r[2]/r[1]*100)}%)</td></tr>`).join('')+`</tbody></table><p class="muted">${t('src_op')}</p></div>`;
  return h;
}
function vMarketing(){
  const c=[['cmp0',null],['cmp1',null],['cmp2','lbSpons']];
  let h=head(t('mTitle'),t('mLede'))+lock('lk_neutral')+`<div class="card"><h2>${t('campaigns')}</h2><ul style="list-style:none;padding:0">`+c.map(([k,l])=>`<li class="card" style="margin:6px 0"><b>${t(k)}</b> ${l?`<span class="chip">${t(l)}</span>`:`<span class="chip">${t('lbAd')}</span>`}<div class="label-ai">${t('lbAI')}</div><div class="row"><span class="ok">&#10003; ${t('chkOk')}</span><span class="muted">${t('waitAppr')}</span></div></li>`).join('')+'</ul></div>';
  h+=`<div class="card"><h2>${t('tryBad')}</h2><p>${t('badReq')}</p><button class="btn sec" id="bad">${t('tryBad')}</button>${state.bad?`<div class="alert" role="alert">${t('refused')}</div>`:''}</div>`;
  h+=`<div class="card"><h2>${t('referral')}</h2><ul><li>${t('ref0')}</li><li>${t('ref1')}</li></ul><p>${t('refCohort',{n:num(37)})}</p></div>`+lock('lk_cohort');
  return h;
}
function vQuality(){
  const rows=[['tr0',412,3.4,'5.1%'],['tr1',288,4.9,'7.3%'],['tr2',356,2.1,'3.0%'],['tr3',203,3.0,'4.4%'],['tr4',7,null,null]];
  let h=head(t('qTitle'),t('qLede'))+lock('lk_cohort')+`<div class="card"><h2>${t('cohorts')}</h2><table class="resp"><thead><tr><th>${t('col_trade')}</th><th class="num">${t('col_done')}</th><th class="num">${t('col_disp')}</th><th class="num">${t('col_rep')}</th></tr></thead><tbody>`+rows.map(r=>`<tr><td data-h="${t('col_trade')}">${t(r[0])}</td><td data-h="${t('col_done')}" class="num">${r[1]<10?t('fewer'):num(r[1])}</td><td data-h="${t('col_disp')}" class="num">${r[2]==null?t('fewer'):num(r[2],1)}</td><td data-h="${t('col_rep')}" class="num">${r[3]==null?t('fewer'):new Intl.NumberFormat(tag(),{style:'percent',maximumFractionDigits:1}).format(parseFloat(r[3])/100)}</td></tr>`).join('')+`</tbody></table><p class="label-ai">${t('prepQ')}</p></div>`;
  h+=`<div class="card"><h2>${t('guides')}</h2><ul><li>${t('g0')}</li><li>${t('g1')}</li></ul></div><div class="card">${t('recog')}</div>`+lock('lk_neutral');
  return h;
}
function render(){
  renderChrome();
  const m=document.getElementById('main');
  m.innerHTML={journey:vJourney,team:vTeam,handover:vHandover,finance:vFinance,marketing:vMarketing,quality:vQuality}[state.view]();
  bind();
}
function go(v){state.view=v;render();document.getElementById('main').focus()}
function bind(){
  document.querySelectorAll('#sidenav button').forEach(b=>b.onclick=()=>go(b.dataset.view));
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  on('next',()=>{state.step=Math.min(4,state.step+1);render()});on('back',()=>{state.step=Math.max(0,state.step-1);render()});
  document.querySelectorAll('input[name=preset]').forEach(r=>r.onchange=()=>{state.preset=r.value;state.applied=false;render()});
  on('apply',()=>{state.applied=true;render()});on('second',()=>{state.second=true;render()});
  on('vg',()=>{state.org=false;render()});on('vo',()=>{state.org=true;render()});
  document.querySelectorAll('input[name^=d_]').forEach(r=>r.onchange=()=>{state.duties[r.name.slice(2)]=r.value});
  on('hn',()=>{state.h++;render()});on('hr',()=>{state.h=0;render()});
  on('bad',()=>{state.bad=true;render()});
}
document.getElementById('lang').onchange=(e)=>{state.lang=e.target.value;try{localStorage.setItem('tw-proto-lang',state.lang)}catch(_){}render()};
document.getElementById('navsel').onchange=(e)=>go(e.target.value);
document.getElementById('theme').onchange=(e)=>{if(e.target.value)document.documentElement.setAttribute('data-theme',e.target.value);else document.documentElement.removeAttribute('data-theme')};
render();
</script>
</body>
</html>
