<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery and outreach prototype</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--muted:#5b6472;--line:#dde1e7;--brand:#1f5fd6;--brand-ink:#fff;--ok:#0f7a3d;--okbg:#e6f4ec;--warn:#8a5a00;--warnbg:#fff4dc;--bad:#a1271b;--badbg:#fde8e6;--info:#1f4f99;--infobg:#e8f0fd;--band:#0f172a;--lp-bg:var(--card);--lp-ink:var(--ink);--lp-line:var(--line);--lp-accent:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--muted:#9aa4b2;--line:#2d333b;--brand:#5b9bff;--brand-ink:#0d1117;--ok:#56d38a;--okbg:#10291b;--warn:#f0c060;--warnbg:#2c2410;--bad:#ff8a7a;--badbg:#341613;--info:#8ab4ff;--infobg:#132238;--band:#000}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--brand)}
.demo{background:var(--warnbg);color:var(--warn);padding:6px 16px;font-size:13px;border-bottom:1px solid var(--line)}
header{background:var(--band);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.sq{display:inline-grid;grid-template-columns:repeat(3,8px);gap:2px}.sq i{width:8px;height:8px;background:#3b82f6;display:block}
.band small{opacity:.8;font-weight:400}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
nav.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 4px}h2{font-size:17px;margin:18px 0 8px}h3{font-size:15px;margin:12px 0 6px}
.lede{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:2fr 1fr}
@media (max-width:820px){.g2,.g3{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.b-src{background:var(--infobg);color:var(--info)}.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-mut{background:transparent;color:var(--muted);border-color:var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
@media (max-width:640px){table.resp thead{display:none}table.resp tr{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:6px}table.resp td{display:block;border:0;padding:3px 4px}table.resp td::before{content:attr(data-l);display:block;color:var(--muted);font-size:12px}}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;margin:4px 6px 4px 0}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,nav.tabs button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:13px}
.src{font-size:12px;color:var(--muted)}
.gate{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.gate .ic{flex:0 0 74px}
.msg{white-space:pre-wrap;font-family:ui-serif,Georgia,serif;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:14px}
.lock{background:var(--infobg);border-left:3px solid var(--info);padding:0 4px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--band);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;max-width:90vw;z-index:9}
.list button.item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;font:inherit}
.list button.item[aria-current="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.steps{list-style:none;padding:0;margin:0}.steps li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
select,input[type=text],textarea{font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
label{display:block;margin:8px 0 4px;font-weight:600;font-size:14px}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.flow span{padding:4px 8px;border-radius:6px;border:1px solid var(--line);font-size:13px}.flow span.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.notice{padding:10px;border-radius:8px;margin:8px 0;font-size:14px}
/* Language picker: inherits the header's colour; the menu uses --lp-bg / --lp-ink / --lp-line / --lp-accent */
.lp{position:relative;display:inline-block}
.lp-btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 10px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.lp-btn .lp-ico{flex:none;opacity:.85}
.lp-btn:focus-visible,.lp-opt:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.lp-pop{position:absolute;top:calc(100% + 6px);right:0;z-index:200;width:max-content;min-width:220px;max-width:calc(100vw - 32px);padding:6px;border-radius:10px;border:1px solid var(--lp-line,#d0d5dd);background:var(--lp-bg,#fff);color:var(--lp-ink,#14181f);box-shadow:0 10px 28px rgba(0,0,0,.18);text-align:left}
.lp-pop[hidden]{display:none}
.lp-opt{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;width:100%;min-height:36px;padding:6px 10px 6px 6px;border:0;border-radius:6px;background:transparent;color:inherit;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.lp-opt:hover{background:color-mix(in srgb,var(--lp-accent,#1f5fd6) 10%,transparent)}
.lp-opt[aria-pressed="true"]{font-weight:650}
.lp-check{display:inline-block;width:14px;flex:none;color:var(--lp-accent,#1f5fd6)}
.lp-note{flex-basis:100%;padding-left:22px;font-size:11.5px;font-weight:400;opacity:.75}

header .lp-btn{border-color:#475569}
.grid>*{min-width:0}
.steps li>span:last-child,.gate>span:last-child{min-width:0;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="demo" data-i="demo"></div>
<header>
  <div class="brand"><span class="sq" aria-hidden="true"><i></i><i></i><i></i></span><span><span data-i="brandName"></span> <small data-i="hubName"></small></span></div>
  <div id="langPicker"></div>
</header>
<nav class="tabs" role="tablist" data-i-label="views">
  <button role="tab" data-v="page" aria-selected="true" data-i="tabPage"></button>
  <button role="tab" data-v="review" aria-selected="false" data-i="tabReview"></button>
  <button role="tab" data-v="campaign" aria-selected="false" data-i="tabCampaign"></button>
  <button role="tab" data-v="claims" aria-selected="false" data-i="tabClaims"></button>
  <button role="tab" data-v="object" aria-selected="false" data-i="tabObject"></button>
</nav>
<main id="main" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- Language kit: the seven engine languages (shared by the Trustwork prototypes) ---------- */
/* Every user-facing string lives in MESSAGES[tag]: one object per language. English is the reference. */
const L10N = (function () {
  "use strict";
  // Order and own names follow the product's language list (en, es, ru, uz-Latn, ka, hy, az-Latn).
  // `review` mirrors docs/engine/localization.md: everything except English is unreviewed text in these prototypes.
  const LOCALES = [
    { tag: "en", name: "English", fmt: "en-US", dir: "ltr", review: "reference" },
    { tag: "es", name: "Español", fmt: "es-US", dir: "ltr", review: "machine" },
    { tag: "ru", name: "Русский", fmt: "ru-RU", dir: "ltr", review: "unreviewed" },
    { tag: "uz-Latn", name: "Oʻzbekcha", fmt: "uz-Latn", dir: "ltr", review: "machine" },
    { tag: "ka", name: "ქართული", fmt: "ka", dir: "ltr", review: "machine" },
    { tag: "hy", name: "Հայերեն", fmt: "hy", dir: "ltr", review: "machine" },
    { tag: "az-Latn", name: "Azərbaycanca", fmt: "az-Latn", dir: "ltr", review: "machine" }
  ];
  const KIT = {
    en: { label: "Interface language", machine: "machine draft", machineTitle: "Machine translation, not yet reviewed by a native speaker", unreviewed: "not proofread", unreviewedTitle: "Not yet proofread by an editor" },
    es: { label: "Idioma de la interfaz", machine: "traducción automática", machineTitle: "Traducción automática, aún sin revisión de un hablante nativo", unreviewed: "sin revisar", unreviewedTitle: "Aún sin revisión editorial" },
    ru: { label: "Язык интерфейса", machine: "машинный перевод", machineTitle: "Машинный перевод, носитель языка ещё не проверял", unreviewed: "не вычитано", unreviewedTitle: "Текст ещё не вычитан редактором" },
    "uz-Latn": { label: "Interfeys tili", machine: "mashina tarjimasi", machineTitle: "Mashina tarjimasi, ona tilida soʻzlashuvchi hali tekshirmagan", unreviewed: "tekshirilmagan", unreviewedTitle: "Muharrir hali tekshirmagan" },
    ka: { label: "ინტერფეისის ენა", machine: "მანქანური თარგმანი", machineTitle: "მანქანური თარგმანი, მშობლიურ ენაზე მოლაპარაკეს ჯერ არ შეუმოწმებია", unreviewed: "შეუმოწმებელი", unreviewedTitle: "რედაქტორს ჯერ არ შეუმოწმებია" },
    hy: { label: "Ինտերֆեյսի լեզու", machine: "մեքենայական թարգմանություն", machineTitle: "Մեքենայական թարգմանություն, մայրենի լեզվով խոսողը դեռ չի ստուգել", unreviewed: "չստուգված", unreviewedTitle: "Խմբագիրը դեռ չի ստուգել" },
    "az-Latn": { label: "İnterfeys dili", machine: "maşın tərcüməsi", machineTitle: "Maşın tərcüməsi, ana dili daşıyıcısı hələ yoxlamayıb", unreviewed: "yoxlanılmayıb", unreviewedTitle: "Redaktor hələ yoxlamayıb" }
  };
  const STORE = "trustwork.prototype.lang";
  const listeners = [];
  let lang = "en";
  try { const saved = localStorage.getItem(STORE); if (LOCALES.some(function (l) { return l.tag === saved; })) lang = saved; } catch (e) { /* storage unavailable: keep English */ }

  function info(tag) { return LOCALES.find(function (l) { return l.tag === (tag || lang); }); }
  function fmt() { return info().fmt; }
  function lookup(tag, key) {
    const table = (typeof MESSAGES !== "undefined" && MESSAGES[tag]) || {};
    return key.split(".").reduce(function (o, k) { return o != null ? o[k] : undefined; }, table);
  }
  function interp(s, vars) {
    if (!vars) return s;
    return Object.keys(vars).reduce(function (acc, k) { return acc.split("{" + k + "}").join(vars[k]); }, s);
  }
  /** A message in the active language: a string (interpolated), an array or an object. Missing keys are reported. */
  function t(key, vars) {
    let v = lookup(lang, key);
    if (v === undefined) {
      console.error("Missing message", lang, key);
      v = lookup("en", key);

    }
    return typeof v === "string" ? interp(v, vars) : v;
  }
  /** A counted message: {one, few, many, other} chosen with Intl.PluralRules; {n} is the formatted count. */
  function tp(key, n, vars) {
    const forms = t(key);
    const form = typeof forms === "string" ? forms : (forms[new Intl.PluralRules(fmt()).select(n)] || forms.other);
    return interp(form, Object.assign({ n: num(n) }, vars || {}));
  }
  /* Browsers trim their ICU data: Chrome has no date, number or region data for Uzbek, Georgian, Armenian or

  const CLDR = {
    "uz-Latn": { group: "\u00a0", decimal: ",", currency: "{n} US$", months: ["yan", "fev", "mar", "apr", "may", "iyn", "iyl", "avg", "sen", "okt", "noy", "dek"], weekdays: ["yak", "dush", "sesh", "chor", "pay", "jum", "shan"], date: "{d}-{M}, {y}", monthDay: "{d}-{M}", region: { US: "Amerika Qoʻshma Shtatlari" } },
    ka: { group: "\u00a0", decimal: ",", currency: "{n} US$", months: ["იან", "თებ", "მარ", "აპრ", "მაი", "ივნ", "ივლ", "აგვ", "სექ", "ოქტ", "ნოე", "დეკ"], weekdays: ["კვი", "ორშ", "სამ", "ოთხ", "ხუთ", "პარ", "შაბ"], date: "{d} {M}. {y}", monthDay: "{d} {M}.", region: { US: "ამერიკის შეერთებული შტატები" } },
    hy: { group: "\u00a0", decimal: ",", currency: "{n} US$", months: ["հնվ", "փտվ", "մրտ", "ապր", "մյս", "հնս", "հլս", "օգս", "սեպ", "հոկ", "նոյ", "դեկ"], weekdays: ["կիր", "երկ", "երք", "չրք", "հնգ", "ուր", "շբթ"], date: "{d} {M}, {y} թ.", monthDay: "{d} {M}", region: { US: "Միացյալ Նահանգներ" } },
    "az-Latn": { group: ".", decimal: ",", currency: "{n} US$", months: ["yan", "fev", "mar", "apr", "may", "iyn", "iyl", "avq", "sen", "okt", "noy", "dek"], weekdays: ["B.", "B.e.", "Ç.a.", "Ç.", "C.a.", "C.", "Ş."], date: "{d} {M} {y}", monthDay: "{d} {M}", region: { US: "Amerika Birləşmiş Ştatları" } }
  };
  function cldr() { return CLDR[lang]; }
  function swap(s, c) { return s.replace(/[,.]/g, function (ch) { return ch === "," ? "\u0001" : "\u0002"; }).replace(/\u0001/g, c.group).replace(/\u0002/g, c.decimal); }
  function num(n, opts) { const c = cldr(); const s = new Intl.NumberFormat(c ? "en-US" : fmt(), opts).format(n); return c ? swap(s, c) : s; }
  function money(n, opts) {
    const o = Object.assign({ style: "currency", currency: "USD" }, opts || {}), c = cldr();
    if (!c) return new Intl.NumberFormat(fmt(), o).format(n);
    const plain = Object.assign({}, o); delete plain.style; delete plain.currency;
    if (plain.minimumFractionDigits == null && plain.maximumFractionDigits == null) { plain.minimumFractionDigits = 2; plain.maximumFractionDigits = 2; }
    if (plain.maximumFractionDigits != null && plain.minimumFractionDigits == null) plain.minimumFractionDigits = Math.min(plain.maximumFractionDigits, 2);
    return interp(c.currency, { n: num(n, plain) });
  }
  function date(d, opts) {
    const when = d instanceof Date ? d : new Date(d), o = opts || { dateStyle: "medium" }, c = cldr();
    if (!c) return new Intl.DateTimeFormat(fmt(), o).format(when);
    const parts = {};
    new Intl.DateTimeFormat("en-US", { timeZone: o.timeZone, year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23" })
      .formatToParts(when).forEach(function (p) { parts[p.type] = p.value; });
    const wd = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(parts.weekday);
    const time = String(parts.hour).padStart(2, "0") + ":" + parts.minute;
    const v = { d: String(Number(parts.day)), M: c.months[Number(parts.month) - 1], y: parts.year };
    const withTime = !!(o.timeStyle || o.hour);
    if (o.timeStyle && !o.dateStyle) return time;
    if (o.weekday && !o.month) return c.weekdays[wd] + (withTime ? " " + time : "");
    const dayText = interp(o.dateStyle || o.year ? c.date : c.monthDay, v);
    return withTime ? dayText + ", " + time : dayText;
  }
  function percent(n, digits) { return num(n, { maximumFractionDigits: digits == null ? 0 : digits, minimumFractionDigits: digits == null ? 0 : digits }) + "%"; }
  function region(code) { const c = cldr(); if (c && c.region[code]) return c.region[code]; try { return new Intl.DisplayNames([fmt()], { type: "region" }).of(code) || code; } catch (e) { return code; } }
  function list(items) { if (cldr()) return items.join(", "); try { return new Intl.ListFormat(fmt(), { style: "short", type: "conjunction" }).format(items); } catch (e) { return items.join(", "); } }

  function apply() {
    const l = info();
    document.documentElement.lang = l.tag;
    document.documentElement.dir = l.dir;
  }
  function set(tag) {
    if (!info(tag) || tag === lang) return;
    lang = tag;
    try { localStorage.setItem(STORE, tag); } catch (e) { /* not remembered */ }
    apply();
    pickers.forEach(function (p) { p.refresh(); });
    listeners.forEach(function (fn) { fn(tag); });
  }
  function onChange(fn) { listeners.push(fn); }

  const GLOBE = '<svg class="lp-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>';
  const CARET = '<svg class="lp-ico" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  const pickers = [];
  let seq = 0;
  /** Disclosure button plus a group of pressed-state buttons, one per engine language, each in its own name and script. */
  function mount(host) {
    const id = "lp-pop-" + (++seq);
    host.classList.add("lp");
    host.innerHTML = '<button type="button" class="lp-btn" aria-expanded="false" aria-controls="' + id + '">' + GLOBE + '<span class="lp-cur"></span>' + CARET + '</button><div class="lp-pop" id="' + id + '" role="group" hidden></div>';
    const btn = host.querySelector(".lp-btn"), pop = host.querySelector(".lp-pop"), cur = host.querySelector(".lp-cur");
    function options() { return Array.prototype.slice.call(pop.querySelectorAll(".lp-opt")); }
    function close(focusBtn) { pop.hidden = true; btn.setAttribute("aria-expanded", "false"); if (focusBtn) btn.focus(); }
    function open() {
      pop.hidden = false; btn.setAttribute("aria-expanded", "true");
      pop.style.cssText = "";
      if (window.innerWidth < 640) {
        // Phone: a full-width sheet under the button, never wider than the screen.
        const b = btn.getBoundingClientRect();
        pop.style.cssText = "position:fixed;left:16px;right:16px;width:auto;max-width:none;top:" + Math.round(b.bottom + 6) + "px;max-height:calc(100vh - " + Math.round(b.bottom + 22) + "px);overflow:auto";
      } else {
        const r = pop.getBoundingClientRect();
        if (r.left < 8) { pop.style.right = "auto"; pop.style.left = "0"; }
      }
      const active = pop.querySelector('[aria-pressed="true"]') || options()[0];
      active.focus();
    }
    function refresh() {
      const l = info();
      cur.textContent = l.name; cur.setAttribute("lang", l.tag);
      btn.setAttribute("aria-label", l.name + " – " + KIT[l.tag].label);
      pop.setAttribute("aria-label", KIT[l.tag].label);
      pop.innerHTML = LOCALES.map(function (o) {
        const k = KIT[o.tag];
        const note = o.review === "machine" ? k.machine : o.review === "unreviewed" ? k.unreviewed : "";
        const title = o.review === "machine" ? k.machineTitle : o.review === "unreviewed" ? k.unreviewedTitle : "";
        return '<button type="button" class="lp-opt" data-lp="' + o.tag + '" lang="' + o.tag + '" aria-pressed="' + (o.tag === lang) + '"' + (title ? ' title="' + title + '"' : "") + '>' +
          '<span class="lp-check" aria-hidden="true">' + (o.tag === lang ? "✓" : "") + '</span><span class="lp-name">' + o.name + '</span>' +
          (note ? '<small class="lp-note">' + note + '</small>' : "") + '</button>';
      }).join("");
    }
    btn.addEventListener("click", function () { if (pop.hidden) open(); else close(false); });
    pop.addEventListener("click", function (e) { const o = e.target.closest(".lp-opt"); if (!o) return; close(true); set(o.getAttribute("data-lp")); });
    pop.addEventListener("keydown", function (e) {
      const opts = options(), i = opts.indexOf(document.activeElement);

 <div class="card"><h2>${t('gatesH')}</h2><label for="recip">${t('recipPick')}</label><select id="recip">${recips.map((r,i)=>`<option value="${i}" ${i===state.recip?'selected':''}>${esc(r)}</option>`).join('')}</select>
 <div role="list">${t('gNames').map((n,i)=>`<div class="gate" role="listitem"><span class="ic">${badge(lab[res.g[i]][0],lab[res.g[i]][1])}</span><span><strong class="small">${i+1}. ${esc(n)}</strong>${res.why[i]?`<div class="small muted">${esc(res.why[i])}</div>`:''}</span></div>`).join('')}</div></div></div>
 <div class="card"><h2>${t('previewH')}</h2><label for="pvl">${t('pvLang')}</label><select id="pvl"><option value="en" lang="en" ${state.pvLang==='en'?'selected':''}>English (US)</option><option value="es" lang="es" ${state.pvLang==='es'?'selected':''}>Español (US)</option></select>
 <p class="small muted">${t('locked')}</p><div class="msg" lang="${state.pvLang}">${message(state.pvLang)}</div>
 <button class="btn" data-a="dry">${t('dryBtn')}</button><button class="btn primary" data-a="approve">${t('approveBtn')}</button></div>
 <div class="card"><h2>${t('metricsH')}</h2><div class="kv"><span>${t('mSent')}</span><strong>${L10N.num(strict?0:187)}</strong><span>${t('mClaims')}</span><strong>${L10N.num(strict?0:23)}</strong><span>${t('mUnsub')}</span><strong>${L10N.num(strict?0:11)}</strong><span>${t('mCompl')}</span><strong>${strict?L10N.num(0):t('fewer')}</strong></div></div>`}
const claimsData=[{st:['ok','ok','ok','ok','pend','pend'],disp:false},{st:['ok','ok','pend','pend','pend','pend'],disp:true},{st:['ok','ok','na','pend','pend','pend'],disp:false}];
const auditTimes=['2026-10-14T10:02:00-07:00','2026-10-15T08:41:00-07:00','2026-10-15T08:41:00-07:00','2026-10-15T08:42:00-07:00','2026-10-16T14:10:00-07:00'];
function vClaims(){const c=claimsData[state.claim];const lab={ok:['b-ok','✓ '+t('stOk')],pend:['b-warn','… '+t('stPend')],na:['b-mut',t('stNa')]};
 const claimedOk=c.st[0]==='ok'&&c.st[1]==='ok'&&(c.st[2]==='ok'||c.st[3]==='ok')&&!c.disp;const verOk=c.st.every(s=>s==='ok')&&!c.disp;
 return `<h1>${t('claimsH')}</h1><p class="lede">${t('claimsLede')}</p><div class="grid g3" style="grid-template-columns:1fr 2fr"><div class="list">${['c1t','c2t','c3t'].map((k,i)=>`<button class="item" data-claim="${i}" aria-current="${i===state.claim}">${esc(t(k))}</button>`).join('')}</div>
 <div class="card">${c.disp?`<div class="notice" style="background:var(--badbg);color:var(--bad)">${esc(t('disputeBanner',{d:day('2026-11-08')}))}</div>`:''}
 <ol class="steps">${t('claimSteps').map((s,i)=>`<li>${badge(lab[c.st[i]][0],lab[c.st[i]][1])}<span>${esc(s)}</span></li>`).join('')}</ol>
 <button class="btn" data-a="claimed" ${claimedOk?'':'disabled'}>${t('levelClaimed')}</button><button class="btn primary" data-a="verified" ${verOk?'':'disabled'}>${t('levelVerified')}</button>
 <h3>${t('handH')}</h3><p class="small">${t('claimedGets')}</p><p class="small">${t('verifiedGets')}</p><p class="small muted">${t('cooling')}</p>
 <h3>${t('auditH')}</h3><ul class="small muted">${t('audit').map((a,i)=>`<li>${esc(stamp(auditTimes[i]))} · ${esc(a)}</li>`).join('')}</ul></div></div>`}
function vObject(){const s=state.oStep;const kinds=[['stop','oStop'],['corr','oCorr'],['erase','oErase'],['remove','oRemove']];
 let body='';
 if(s===0)body=`<fieldset style="border:0;padding:0"><legend><strong>${t('oQ')}</strong></legend>${kinds.map(([v,k])=>`<label style="font-weight:400"><input type="radio" name="ok" value="${v}" ${state.oKind===v?'checked':''}> ${t(k)}</label>`).join('')}</fieldset><button class="btn primary" data-a="onext">${t('oNext')}</button>`;
 if(s===1)body=`<label for="oem">${t('oEmail')}</label><input id="oem" type="text" value="info@example-roofing.invalid" size="32"><br><button class="btn" data-a="osend">${t('oSend')}</button><label for="ocode">${t('oCode')}</label><input id="ocode" type="text" inputmode="numeric" maxlength="6" size="8"><br><button class="btn primary" data-a="overify">${t('oVerify')}</button>`;
 if(s>=2){const m={stop:'oResStop',corr:'oResCorr',erase:'oResErase',remove:'oResRemove'}[state.oKind];body=`<div class="notice" style="background:var(--okbg);color:var(--ok)">${t(m)}</div><button class="btn" data-a="oreset" aria-label="${esc(t('restart'))}" title="${esc(t('restart'))}">↺</button>`}
 return `<h1>${t('objH')}</h1><p class="lede">${t('objLede')}</p><div class="flow" role="list" aria-label="${esc(t('steps'))}">${t('oStep').map((x,i)=>`<span role="listitem" class="${i===Math.min(s,3)?'on':''}">${i+1}. ${esc(x)}</span>`).join('')}</div>
 <div class="grid g2"><div class="card">${body}</div><div class="card"><h3>${t('effectsH')}</h3><ol class="small">${t('eff').map((e,i)=>`<li style="${s>=2&&(i!==3||state.oKind==='erase')?'':'opacity:.5'}">${esc(e)}</li>`).join('')}</ol></div></div>
 <div class="card"><h2>${t('adminH')}</h2><div class="grid g2"><div><label for="lk">${t('lookup')}</label><input id="lk" type="text" value="info@example-roofing.invalid" size="30"> <button class="btn" data-a="look">${t('lookBtn')}</button><div id="lkr" class="small" role="status"></div></div>
 <div><h3>${t('counts')}</h3><div class="kv"><span>${t('unsub')}</span><strong>${L10N.num(11)}</strong><span>${t('objection')}</span><strong>${t('fewer')}</strong><span>${t('bounce')}</span><strong>${L10N.num(14)}</strong><span>${t('erasure')}</span><strong>${t('fewer')}</strong></div></div></div></div>`}
function render(){document.title=t('docTitle');document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-i-label]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.iLabel)));
 document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===V));
 const m=document.getElementById('main');m.innerHTML={page:vPage,review:vReview,campaign:vCampaign,claims:vClaims,object:vObject}[V]();bind()}
function bind(){const m=document.getElementById('main');
 m.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{state.sel=+b.dataset.sel;render()});
 m.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{state.claim=+b.dataset.claim;render()});
 const mo=m.querySelector('#mode');if(mo)mo.onchange=e=>{state.mode=e.target.value;render()};
 const rc=m.querySelector('#recip');if(rc)rc.onchange=e=>{state.recip=+e.target.value;render()};
 const pv=m.querySelector('#pvl');if(pv)pv.onchange=e=>{state.pvLang=e.target.value;render()};
 m.querySelectorAll('input[name=ok]').forEach(r=>r.onchange=e=>state.oKind=e.target.value);
 m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
  const map={claim:()=>{toast(t('toastClaim'))},corr:()=>toast(t('toastCorr')),about:()=>{V='object';state.oStep=0;render()},link:()=>toast(t('tLinked')),reject:()=>toast(t('tRejected')),distinct:()=>toast(t('tDistinct')),split:()=>toast(t('tSplit')),batch:()=>toast(tp('tBatch',14)),
  dry:()=>toast(state.mode==='strict'?t('tStrictBlock'):t('tDry',{pass:L10N.num(61),stop:L10N.num(153)})),approve:()=>toast(state.mode==='strict'?t('tStrictBlock'):t('tApprove')),claimed:()=>toast(t('tClaimed')),verified:()=>toast(t('tVerified')),
  onext:()=>{state.oStep=1;render()},osend:()=>toast(t('oSent')),overify:()=>{const v=(m.querySelector('#ocode')||{}).value||'';if(/^\d{6}$/.test(v)){state.oStep=2;render()}else toast(t('oCode'))},oreset:()=>{state.oStep=0;render()},
  look:()=>{m.querySelector('#lkr').textContent=t('lookRes',{d:day('2026-10-31')})}};(map[a]||(()=>{}))()})}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{V=b.dataset.v;render();document.getElementById('main').focus()});
L10N.mount(document.getElementById('langPicker'));
L10N.onChange(render);
render();
</script>
