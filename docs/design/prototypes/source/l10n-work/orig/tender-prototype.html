<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trustwork tender desk prototype (synthetic data)</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--text:#14161a;--muted:#5b6270;--border:#dde1e7;--accent:#1f4fd1;--accent-ink:#fff;--navy:#0f1b3d;
  --ok:#17723a;--ok-bg:#e6f4ea;--warn:#8a5a00;--warn-bg:#fff4d6;--bad:#a8231c;--bad-bg:#fde8e6;--info:#1f4fd1;--info-bg:#e8eefc;
  --radius:10px;--focus:0 0 0 3px #f5b70066, 0 0 0 1px #8a5a00;
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
a{color:var(--accent)}
button,input,select,textarea{font:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.demo{background:#fff4d6;color:#5c3d00;text-align:center;padding:6px 12px;font-size:13px;border-bottom:1px solid #e9d08a}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 31px)}
.side{background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;padding:6px 8px 14px}
.brand .sq{display:inline-grid;grid-template-columns:repeat(3,8px);gap:2px}.brand .sq i{width:8px;height:8px;background:var(--accent);display:block}
.nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none}
.nav a[aria-current="page"]{background:var(--info-bg);color:var(--accent);font-weight:600}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.crumbs{color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:8px;align-items:center}
.lang{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:5px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
.avatar{width:32px;height:32px;border-radius:50%;background:#c9d4f2;display:grid;place-items:center;font-weight:700;color:var(--navy)}
.menu-btn{display:none;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px}
.content{padding:18px 20px 120px;max-width:1200px}
h1{font-size:24px;margin:4px 0 2px}h2{font-size:18px;margin:18px 0 8px}h3{font-size:15px;margin:12px 0 6px}
.sub{color:var(--muted);margin:0 0 12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:12px 0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--text);font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-size:12.5px;background:#fff;white-space:nowrap}
.chip.ok{background:var(--ok-bg);border-color:#bfe2c9;color:var(--ok)}
.chip.warn{background:var(--warn-bg);border-color:#f0d58a;color:var(--warn)}
.chip.bad{background:var(--bad-bg);border-color:#f3c0bb;color:var(--bad)}
.chip.info{background:var(--info-bg);border-color:#c6d4f7;color:var(--info)}
.chip.lock{background:#f1f2f5}
.btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 10px;font-size:13px}
.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
table{width:100%;border-collapse:collapse;background:var(--surface)}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:#fafbfc}
.table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
.reasons{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
.row-link{cursor:pointer}.row-link:hover td{background:#f8faff}
.muted{color:var(--muted)}.small{font-size:13px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.banner{border-radius:8px;padding:10px 12px;margin:10px 0;border:1px solid}
.banner.warn{background:var(--warn-bg);border-color:#f0d58a}
.banner.info{background:var(--info-bg);border-color:#c6d4f7}
.banner.bad{background:var(--bad-bg);border-color:#f3c0bb}
.score{font-variant-numeric:tabular-nums}
.rec{font-size:17px;font-weight:700}
input[type=number],input[type=text],textarea,select{border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
td input[type=number]{width:110px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,100%);background:#fff;border-left:1px solid var(--border);box-shadow:-8px 0 24px #0002;padding:16px;z-index:40;overflow:auto;transform:translateX(105%);transition:transform .18s}
.drawer.open{transform:none}
.page-sim{border:1px solid var(--border);border-radius:6px;padding:14px;font-family:Georgia,serif;font-size:13.5px;background:#fffef8}
mark{background:#ffe48a;padding:1px 2px}
.dialog-back{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.dialog-back.open{display:flex}
.dialog{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.dialog h2{margin-top:0}
.dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.launcher{position:fixed;right:18px;bottom:18px;z-index:50;border:0;background:var(--navy);color:#fff;border-radius:999px;padding:12px 18px;box-shadow:0 6px 18px #0003;cursor:pointer;font-weight:600}
.launcher .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f5b700;margin-left:6px}
.overlay{position:fixed;right:18px;bottom:76px;width:min(400px,calc(100% - 24px));max-height:min(640px,calc(100vh - 110px));background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px #0003;z-index:50;display:none;flex-direction:column}
.overlay.open{display:flex}
.ov-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.ov-body{padding:12px 14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.msg{border-radius:10px;padding:9px 11px;font-size:14px}
.msg.agent{background:#f3f5f9}
.msg.me{background:var(--info-bg);align-self:flex-end;max-width:85%}
.proposal{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff}
.proposal .label{font-size:12px;color:var(--muted)}
.ov-input{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border)}
.thread{display:flex;flex-direction:column;gap:10px}
.q{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff}
.q.answer{background:#f7faf7;border-color:#cfe6d6}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)}
.outline li{margin:4px 0}
.hint{font-size:12.5px;color:var(--muted)}
.cards-mobile{display:none}
.mcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
@media (max-width:767px){
  .shell{grid-template-columns:1fr}
  .side{display:none;position:fixed;inset:31px 0 0 0;z-index:45}
  .side.open{display:flex}
  .menu-btn{display:inline-block}
  .content{padding:14px 12px 120px}
  .desktop-only{display:none}
  .cards-mobile{display:block}
  .kv{grid-template-columns:1fr}
  .launcher{right:12px;bottom:12px}
  .overlay{right:0;left:0;bottom:0;width:100%;max-height:85vh;border-radius:14px 14px 0 0}
  .crumbs{display:none}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<a class="sr" href="#main" id="skip"></a>
<div class="demo" id="demoBanner"></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Workspace">
    <div class="brand"><span class="sq" aria-hidden="true"><i></i><i></i><i></i></span><span id="brandName">Trustwork</span></div>
    <div class="nav" id="nav"></div>
  </nav>
  <div class="main">
    <header class="top">
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side"></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <div class="lang" role="group" id="langGroup">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        </div>
        <span class="avatar" aria-hidden="true">MR</span>
      </div>
    </header>
    <main class="content" id="main" tabindex="-1"></main>
  </div>
</div>

<aside class="drawer" id="drawer" aria-labelledby="drawerTitle" role="complementary"></aside>
<div class="dialog-back" id="dialogBack"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" id="dialog"></div></div>

<button class="launcher" id="launcher" aria-expanded="false" aria-controls="overlay"></button>
<section class="overlay" id="overlay" aria-labelledby="ovTitle">
  <div class="ov-head"><strong id="ovTitle"></strong><button class="btn small" id="ovClose"></button></div>
  <div class="ov-body" id="ovBody" role="log" aria-live="polite"></div>
  <form class="ov-input" id="ovForm"><label class="sr" for="ovText" id="ovLabel"></label><input type="text" id="ovText"><button class="btn primary small" id="ovSend"></button></form>
</section>

function priceCalc(){
  return LINES.map(l=>{const total=l.qty*l.price;const margin=(l.price-l.cost)/l.price*100;return Object.assign({},l,{total,margin})});
}
function tabPricing(){
  const L=priceCalc();const total=L.reduce((a,l)=>a+l.total,0);const cost=L.reduce((a,l)=>a+l.qty*l.cost,0);const m=(total-cost)/total*100;
  const findings=[];L.forEach(l=>{if(l.margin<FLOOR)findings.push(t("belowFloor").replace("{n}",l.n).replace("{m}",l.margin.toFixed(1)).replace("{f}",FLOOR));if(l.price>l.cost*2)findings.push(t("unbalanced").replace("{n}",l.n))});

   return `<h2 style="margin-top:0">${t("buyerSees")}</h2><p class="sub">${esc(t("buyerSeesBody"))}</p>

   ${L.map(l=>`<tr><td>${l.n}. ${esc(l.desc[lang])}</td><td class="num">${l.qty.toLocaleString(lang==="ru"?"ru-RU":"en-US")} ${l.unit}</td><td class="num">${new Intl.NumberFormat(lang==="ru"?"ru-RU":"en-US",{style:"currency",currency:"USD"}).format(l.price)}</td><td class="num">${fmtMoney(l.total)}</td></tr>`).join("")}
   <tr><th colspan="3">${t("totalBid")}</th><th class="num">${fmtMoney(total)}</th></tr></tbody></table></div>
   <p><button class="btn" id="toggleBuyer">${t("hideBuyer")}</button></p>`;
  }
  return `<h2 style="margin-top:0">${t("priceTitle")}</h2><p class="sub">${esc(t("priceSub"))}</p>
  <div class="table-wrap" role="region" tabindex="0" aria-label="${esc(t("priceTitle"))}"><table><thead><tr><th>${t("colLine")}</th><th>${t("colQty")}</th><th class="num">${t("colCost")}</th><th class="num">${t("colUnit")}</th><th class="num">${t("colTotal")}</th><th class="num">${t("colMargin")}</th></tr></thead><tbody>
  ${L.map(l=>`<tr><td>${l.n}. ${esc(l.desc[lang])}</td><td class="small">${l.qty.toLocaleString(lang==="ru"?"ru-RU":"en-US")} ${l.unit}<br><span class="muted">${esc(l.src[lang])}</span></td><td class="num">${l.cost.toLocaleString(lang==="ru"?"ru-RU":"en-US")}</td>
   <td class="num"><label class="sr" for="p${l.n}">${t("colUnit")}, ${t("colLine").toLowerCase()} ${l.n}</label><input type="number" step="0.1" id="p${l.n}" data-price="${l.n}" value="${l.price}"></td>
   <td class="num">${fmtMoney(l.total)}</td><td class="num">${l.margin<FLOOR?chip("bad",l.margin.toFixed(1)+"%"):l.margin.toFixed(1)+"%"}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="grid3" style="margin-top:12px">
   <div class="card"><div class="small muted">${t("totalBid")}</div><div class="rec">${fmtMoney(total)}</div></div>
   <div class="card"><div class="small muted">${t("totalMargin")}</div><div class="rec">${m.toFixed(1)}%</div><div class="small"><span class="chip lock">🔒 ${t("floor")}: ${FLOOR}%</span></div></div>
   <div class="card" aria-live="polite"><div class="small muted">${t("guard")}</div>${findings.length?`<ul class="small" style="margin:4px 0;padding-left:18px">${findings.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:`<div>${chip("ok",t("guardOk"))}</div>`}</div>
  </div>
  <p class="small muted">${esc(t("escalation"))}</p>
  <button class="btn" id="toggleBuyer">${t("showBuyer")}</button>`;

/* dialogs */
let lastFocus=null;
function openDialog(html,onReady){lastFocus=document.activeElement;const d=document.getElementById("dialog");d.innerHTML=html;document.getElementById("dialogBack").classList.add("open");const first=d.querySelector("[data-cancel]")||d.querySelector("button,input");first&&first.focus();onReady&&onReady(d);}
function closeDialog(){document.getElementById("dialogBack").classList.remove("open");lastFocus&&lastFocus.focus&&lastFocus.focus();}
document.getElementById("dialogBack").addEventListener("click",e=>{if(e.target.id==="dialogBack"||e.target.dataset.cancel!==undefined)closeDialog();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.getElementById("dialogBack").classList.contains("open"))closeDialog();else if(document.getElementById("drawer").classList.contains("open"))closeDrawer();}});

function decisionDialog(){openDialog(`<h2 id="dlgTitle">${esc(t("decisionTitle"))}</h2><p>${esc(t("decisionBody"))}</p><p class="small">${esc(t("recBidIf"))}</p><div class="actions"><button class="btn" data-cancel>${t("cancel")}</button><button class="btn" id="dNo">${t("decNoBid")}</button><button class="btn primary" id="dYes">${t("decBid")}</button></div>`,d=>{d.querySelector("#dYes").onclick=()=>{state.decided=true;closeDialog();render();};d.querySelector("#dNo").onclick=()=>{closeDialog();};});}
function questionDialog(){openDialog(`<h2 id="dlgTitle">${esc(t("qConfirmTitle"))}</h2><p>${esc(t("qConfirmBody"))}</p><blockquote class="small">${esc(document.getElementById("qText").value)}</blockquote><div class="actions"><button class="btn" data-cancel>${t("cancel")}</button><button class="btn primary" id="qOk">${t("confirm")}</button></div>`,d=>{d.querySelector("#qOk").onclick=()=>{state.qSent=true;closeDialog();render();setTimeout(()=>{state.answered=true;render();},1600);};});}
function submitDialog(){openDialog(`<h2 id="dlgTitle">${esc(t("subConfirmTitle"))}</h2><p>${esc(t("subConfirmBody"))}</p>
 <label for="rcpt" class="small">${t("receipt")}</label><input type="text" id="rcpt" value="SYN-RCPT-55120">
 <label for="code" class="small" style="display:block;margin-top:8px">${t("stepUp")}</label><input type="text" id="code" inputmode="numeric" autocomplete="one-time-code">
 <p class="small" id="codeMsg" role="alert"></p>
 <div class="actions"><button class="btn" data-cancel>${t("cancel")}</button><button class="btn primary" id="sOk">${t("confirm")}</button></div>`,d=>{d.querySelector("#sOk").onclick=()=>{if(d.querySelector("#code").value.trim()==="123456"){state.submitted=true;closeDialog();render();}else{d.querySelector("#codeMsg").textContent=t("wrongCode");}};});}
function expertDialog(){openDialog(`<h2 id="dlgTitle">${esc(t("expertsTitle"))}</h2><p class="small">${esc(t("expertsBody"))}</p>
 <div class="card"><strong>${esc(t("ex1"))}</strong><p class="small">${esc(t("ex1Why"))}</p><p class="small">${esc(t("ex1Offer"))}</p></div>
 <fieldset style="border:1px solid var(--border);border-radius:8px;margin-top:10px"><legend class="small">${esc(t("scopeTitle"))}</legend>
  <label style="display:block"><input type="checkbox" checked> ${esc(t("sReq"))}</label>
  <label style="display:block"><input type="checkbox" checked> ${esc(t("sScore"))}</label>
  <label style="display:block"><input type="checkbox"> ${esc(t("sWork"))} <span class="chip warn">!</span></label></fieldset>
 <p class="hint">${esc(t("conflictNote"))}</p>
 <p class="small" id="bookMsg" role="status">${state.booked?esc(t("booked")):""}</p>
 <div class="actions"><button class="btn" data-cancel>${t("cancel")}</button><button class="btn primary" id="bOk" ${state.booked?'aria-disabled="true"':""}>${esc(t("book"))}</button></div>`,d=>{d.querySelector("#bOk").onclick=()=>{if(state.booked)return;state.booked=true;d.querySelector("#bookMsg").textContent=t("booked");d.querySelector("#bOk").setAttribute("aria-disabled","true");};});}

/* citation drawer */
function openCite(id,btn){const r=REQS.find(x=>x.id===id);const dr=document.getElementById("drawer");
 dr.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 id="drawerTitle" style="margin:0">${esc(t("citeTitle"))}</h2><button class="btn small" id="drClose">${t("close")}</button></div>
 <p class="small muted">${esc(r.doc)} · ${lang==="ru"?"страница":"page"} ${r.page} · ${esc(t("citeNote"))} 3c7e…a19 (synthetic)</p>
 <div class="page-sim" tabindex="-1" id="citePage"><p>… </p><p><mark>${esc(r.quote)}</mark></p><p>…</p></div>
 <p class="small"><strong>${r.id}</strong> ${esc(r.text[lang])}</p>`;
 dr.classList.add("open");dr.dataset.opener=id;btn&&btn.setAttribute("aria-expanded","true");document.getElementById("citePage").focus();document.getElementById("drClose").onclick=closeDrawer;}
function closeDrawer(){const dr=document.getElementById("drawer");dr.classList.remove("open");const b=document.querySelector(`[data-cite="${dr.dataset.opener}"]`);if(b){b.setAttribute("aria-expanded","false");b.focus();}}

/* overlay (the one assistant surface) */
function renderOverlay(){
 const ov=document.getElementById("overlay");ov.classList.toggle("open",state.ovOpen);document.getElementById("launcher").setAttribute("aria-expanded",String(state.ovOpen));
 const props=[["p1",1],["p2",4],["p3",5],["p4","expert"],["p5",7]];
 document.getElementById("ovBody").innerHTML=`<div class="msg agent">${esc(t("aHello"))}</div>
  ${props.map(([k,target])=>`<div class="proposal"><div class="label">${esc(t("propose"))}</div><div>${esc(t(k))}</div><button class="btn small" style="margin-top:6px" data-goto="${target}">${t("go")}</button></div>`).join("")}
  ${state.msgs.map(m=>`<div class="msg ${m.who}">${esc(m.text[lang]||m.text)}</div>`).join("")}`;
}
document.getElementById("launcher").onclick=()=>{state.ovOpen=!state.ovOpen;renderOverlay();if(state.ovOpen)document.getElementById("ovText").focus();};
document.getElementById("ovClose").onclick=()=>{state.ovOpen=false;renderOverlay();document.getElementById("launcher").focus();};
document.getElementById("ovForm").onsubmit=(e)=>{e.preventDefault();const v=document.getElementById("ovText").value.trim();if(!v)return;
 state.msgs.push({who:"me",text:{en:v,ru:v}});
 const wantsSubmit=/submit|send the bid|подай|подать|отправь заявку/i.test(v);
 state.msgs.push({who:"agent",text:{en:I18N.en[wantsSubmit?"aSubmitReply":"aDefault"],ru:I18N.ru[wantsSubmit?"aSubmitReply":"aDefault"]}});
 document.getElementById("ovText").value="";renderOverlay();
 if(wantsSubmit){state.view="pursuit";state.tab=7;render();submitDialog();}
};

/* delegation */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-open],[data-follow],[data-filter],[data-tab],[data-accept],[data-cite],[data-goto],[data-toast],#backBtn,#decideBtn,#expertBtn,#qSendBtn,#submitBtn,#toggleBuyer,#exportBtn,#menuBtn,[data-lang]");
 if(!el)return;
 if(el.dataset.lang){lang=el.dataset.lang;render();return;}
 if(el.id==="menuBtn"){const s=document.getElementById("side");const o=!s.classList.contains("open");s.classList.toggle("open",o);el.setAttribute("aria-expanded",String(o));return;}
 if(el.dataset.follow){e.stopPropagation();state.following[el.dataset.follow]=!state.following[el.dataset.follow];render();return;}
 if(el.dataset.open){state.view="pursuit";state.tab=0;render();document.getElementById("main").focus();return;}
 if(el.dataset.filter){state.filter=el.dataset.filter;render();return;}
 if(el.dataset.tab){state.tab=+el.dataset.tab;render();const b=document.getElementById("tab"+state.tab);b&&b.focus();return;}
 if(el.dataset.accept){state.reqAccepted[el.dataset.accept]=true;render();return;}
 if(el.dataset.cite){openCite(el.dataset.cite,el);return;}
 if(el.dataset.goto){if(el.dataset.goto==="expert"){expertDialog();return;}state.view="pursuit";state.tab=+el.dataset.goto;render();return;}
 if(el.dataset.toast){const m=document.getElementById("teamMsg");if(m)m.textContent=el.dataset.toast==="intro"?(lang==="ru"?"Запрос знакомства подготовлен; отправка после вашего подтверждения (синтетически).":"Introduction request prepared; it is sent after your confirmation (synthetic)."):(lang==="ru"?"Пакет работ: требования R-07, чертежи кровли, срок 20 ноября. Без ваших цен.":"Scope package: requirement R-07, roof drawings, due Nov 20. Your prices are not included.");return;}
 switch(el.id){
  case "backBtn":state.view="list";render();break;
  case "decideBtn":decisionDialog();break;
  case "expertBtn":expertDialog();break;
  case "qSendBtn":questionDialog();break;
  case "submitBtn":submitDialog();break;
  case "toggleBuyer":state.showBuyer=!state.showBuyer;render();break;
  case "exportBtn":document.getElementById("exportMsg").textContent=lang==="ru"?"Файлы подготовлены (синтетически). Хэши записаны.":"Files prepared (synthetic). Digests recorded.";break;
 }
});
document.addEventListener("change",e=>{if(e.target.dataset.price){const l=LINES.find(x=>x.n===+e.target.dataset.price);const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=0){l.price=v;}render();const inp=document.getElementById("p"+l.n);inp&&inp.focus();}});
render();
</script>
