<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trustwork console prototype</title>
<style>
:root{
  --canvas:#f6f5f2;--surface:#fff;--muted:#f0efec;--tint:#f0f5ff;--text:#111827;--text2:#5b6472;--border:#e5e8ee;--border2:#7a8494;
  --accent:#0756d8;--accent-h:#0648b4;--navy:#0f1f3d;--navy2:#16295a;--navy-t:#fff;--navy-t2:#c3cce0;--focus:#0756d8;

  :root:not([data-theme="light"]):not([data-theme="dark"]){

  --accent:#6ea8ff;--accent-h:#8dbaff;--navy:#050a14;--navy2:#0e1830;--navy-t:#fff;--navy-t2:#b9c4d8;--focus:#8dbaff;
  --info-bg:#132a52;--info:#b8d0ff;--ok-bg:#12321f;--ok:#9be0b4;--warn-bg:#3a2b05;--warn:#f5d27a;--bad-bg:#3d1414;--bad:#ffb4b4;--neu-bg:#252c36;--neu:#cdd5df;--ai-bg:#2a1f47;--ai:#d4c3ff;
  --shadow:0 4px 16px rgba(0,0,0,.5);}

*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--canvas);color:var(--text)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--surface);padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
.band{background:var(--navy);color:var(--navy-t);display:flex;align-items:center;gap:12px;padding:8px 16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.band .brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.sq{display:inline-grid;grid-template-columns:repeat(3,8px);gap:2px}.sq i{width:8px;height:8px;background:#1a6ee8;display:block;border-radius:1px}
.band .admin{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-t2);border-left:1px solid rgba(255,255,255,.2);padding-left:10px}
.band .grow{flex:1}
.band button,.band select{background:var(--navy2);color:var(--navy-t);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;min-height:36px;cursor:pointer}
.band .search{min-width:220px;text-align:left;color:var(--navy-t2)}
.band kbd{font-size:11px;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:0 4px;margin-left:6px}
.menu-btn{display:none}
.bands .b{padding:8px 16px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.b.demo{background:var(--warn-bg);color:var(--warn);justify-content:space-between}
.persona-wrap select{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text);min-height:32px;max-width:100%}
.b.kill{background:var(--bad-bg);color:var(--bad);font-weight:600}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 52px)}
nav.side{background:var(--surface);border-right:1px solid var(--border);padding:12px 8px;overflow:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
nav.side details{margin:2px 0}
nav.side summary{cursor:pointer;padding:6px 10px;font-weight:600;font-size:13px;color:var(--text2);border-radius:6px;list-style:none}
nav.side summary::-webkit-details-marker{display:none}
nav.side summary::before{content:"\25B8";display:inline-block;width:14px;transition:transform .15s}
nav.side details[open] summary::before{transform:rotate(90deg)}
nav.side ul{list-style:none;margin:0;padding:0 0 4px 14px}
nav.side a{display:flex;justify-content:space-between;gap:6px;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:14px;min-height:32px;align-items:center}
nav.side a:hover{background:var(--muted)}
nav.side a[aria-current="page"]{background:var(--tint);color:var(--accent);font-weight:600}
.count{font-size:12px;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px}
.nstat{font-size:11px;color:var(--text2)}
main{padding:20px 24px 80px;max-width:1240px;width:100%}
.crumbs{font-size:13px;color:var(--text2);margin-bottom:6px}
.crumbs a{color:var(--text2)}
.acts{font-size:13px;color:var(--text2)}
h1{font-size:28px;line-height:1.2;margin:2px 0 4px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:16px;margin:14px 0 6px}
.lede{color:var(--text2);margin:0 0 16px;max-width:760px}
.titlerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.titlerow .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.c-info{background:var(--info-bg);color:var(--info)}.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-neu{background:var(--neu-bg);color:var(--neu)}.c-ai{background:var(--ai-bg);color:var(--ai)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:0 0 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.tile .n{font-size:26px;font-weight:700}
.tile a{font-size:14px}
button.btn,a.btn{font:inherit;font-size:14px;border-radius:8px;padding:7px 14px;min-height:36px;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent);color:#04101f}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#2a0505}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--muted);font-weight:600;font-size:13px;position:sticky;top:0}
tr.sel td{background:var(--tint)}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filterbar input,.filterbar select,.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text);min-height:36px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--accent);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.fchip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:14px;min-width:24px;min-height:24px}
.bulk{display:flex;gap:8px;align-items:center;background:var(--navy);color:#fff;border-radius:8px;padding:6px 10px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--text2)}
.field .err{font-size:13px;color:var(--bad);font-weight:600}
dl.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 12px;margin:0}
dl.kv dt{color:var(--text2)}dl.kv dd{margin:0}
.locked{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--border)}
.locked:last-child{border-bottom:0}
.locked .lk{flex:none;font-size:12px;font-weight:700;background:var(--neu-bg);color:var(--neu);border-radius:6px;padding:2px 8px;white-space:nowrap}
.diff td.old{background:var(--bad-bg);color:var(--bad)}.diff td.new{background:var(--ok-bg);color:var(--ok)}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix td[aria-selected="true"]{outline:3px solid var(--focus);outline-offset:-3px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{border-left:2px solid var(--border);padding:0 0 12px 14px;position:relative}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);position:absolute;left:-6px;top:6px}
.small{font-size:13px;color:var(--text2)}
.note{background:var(--info-bg);color:var(--info);border-radius:8px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.ok{background:var(--ok-bg);color:var(--ok)}
.drawer{position:fixed;top:52px;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);padding:16px;overflow:auto;z-index:30}
dialog{border:0;border-radius:12px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(15,31,61,.55)}
dialog .dh{padding:16px 18px 0}dialog .db{padding:8px 18px}dialog .df{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#palette{max-width:640px;margin-top:10vh}
#palette input{width:100%;font:inherit;font-size:16px;padding:14px 16px;border:0;border-bottom:1px solid var(--border);background:var(--surface);color:var(--text)}
#palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
#palette li{padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
#palette li[aria-selected="true"]{background:var(--tint);color:var(--accent)}
#palette .grp{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;cursor:default;padding:8px 10px 2px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--text2);padding:8px 12px;border-bottom:3px solid transparent;cursor:pointer;min-height:40px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--text2)}
.empty h2{color:var(--text)}
.meter{height:8px;background:var(--muted);border-radius:4px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--accent)}
@media (max-width:767px){
  .menu-btn{display:inline-flex}
  .band .search{min-width:0;flex:1}
  .band .admin,.band .hide-sm{display:none}
  .layout{grid-template-columns:1fr}
  nav.side{position:fixed;inset:52px 0 0 0;max-height:none;z-index:40;display:none}
  nav.side.open{display:block}
  nav.side a{min-height:44px}
  main{padding:14px 16px 96px}
  h1{font-size:24px}
  .grid2,.grid3{grid-template-columns:1fr}
  dl.kv{grid-template-columns:1fr}
  dl.kv dt{font-weight:600;color:var(--text)}
  table.cards thead{display:none}
  table.cards tr{display:block;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;background:var(--surface);padding:6px}
  table.cards td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 8px}
  table.cards td::before{content:attr(data-label);font-weight:600;color:var(--text2)}
  .stickybar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;z-index:25}
  button.btn,a.btn{min-height:44px}
  .wide-note{display:block}
  .band .search kbd{display:none}
  .band .search{min-width:0}
  .band .brand #brandName{font-size:14px}
  .persona-wrap,.persona-wrap select{width:100%}
}
.wide-note{display:none;font-size:13px;color:var(--text2);margin-bottom:8px}
</style>
</head>

  if ($('#scToggle')) $('#scToggle').onclick = () => { S.shortcuts = !S.shortcuts; render(); };
  const mx = $('#mx'); if (mx) mx.addEventListener('keydown', (e) => { const c = e.target.closest('[role=gridcell]'); if (!c) return; let r = +c.dataset.r, k = +c.dataset.c; const maxR = mx.querySelectorAll('tbody tr').length-1, maxC = 3;
    if (e.key==='ArrowRight') k=Math.min(maxC,k+1); else if (e.key==='ArrowLeft') k=Math.max(0,k-1); else if (e.key==='ArrowDown') r=Math.min(maxR,r+1); else if (e.key==='ArrowUp') r=Math.max(0,r-1); else if (e.key==='Home') k=0; else if (e.key==='End') k=maxC; else return;
    e.preventDefault(); const n = mx.querySelector(`[data-r="${r}"][data-c="${k}"]`); c.tabIndex=-1; c.removeAttribute('aria-selected'); n.tabIndex=0; n.setAttribute('aria-selected','true'); n.focus(); announce(n.title); });
}

/* ---------------- Palette ---------------- */
const COMMANDS = [['in_engage','#/ops/incident'],['sf_invite','#/staff'],['md_draftPrice','#/models'],['cf_requestAct','#/config/egress']];
let palItems = [], palIdx = 0;
function palRender(){
  const q = document.getElementById('palInput').value.trim().toLowerCase();
  const sections = GROUPS.filter(([g]) => canSeeGroup(g)).flatMap(([g, items]) => items.map(([s,h]) => ({label:t('s_'+s), sub:t('g_'+g), h})));
  palItems = [];
  const groups = [];
  if (/@|\S+@\S+|^[a-z]+ [a-z]+$/.test(q) && q.includes('@')) { palItems.push({label:t('pal_lookup'), sub:'', h:'#/support'}); groups.push([t('pal_sections'), palItems.slice()]); }
  else if (q.startsWith('#')) { const id = q.slice(1).toUpperCase(); const a = S.approvals.find((x) => x.id===id); const items = a ? [{label:a.title[lang==='ru'?1:0], sub:a.id, h:'#/inbox'}] : (id==='INC-7' ? [{label:t('in_title'), sub:'INC-7', h:'#/ops/incident'}] : []); palItems.push(...items); groups.push(['#', items]); }
  else {
    const sec = sections.filter((x) => !q || x.label.toLowerCase().includes(q.replace(/^>/,'')) ).slice(0, q.startsWith('>')?0:8);
    const cmd = COMMANDS.map(([k,h]) => ({label:t(k), sub:'', h})).filter((x) => !q || x.label.toLowerCase().includes(q.replace(/^>/,'')));
    palItems.push(...sec, ...cmd); groups.push([t('pal_sections'), sec], [t('pal_commands'), cmd]);
  }
  palIdx = Math.min(palIdx, Math.max(0, palItems.length-1));
  let i = 0;
  const html = groups.filter(([,its]) => its.length).map(([g, its]) => `<li class="grp" role="presentation">${esc(g)}</li>` + its.map((x) => { const idx = i++; return `<li role="option" id="po${idx}" aria-selected="${idx===palIdx}" data-h="${x.h}">${esc(x.label)}<span class="small">${esc(x.sub)}</span></li>`; }).join('')).join('');
  document.getElementById('palList').innerHTML = html || `<li role="option" aria-disabled="true">${esc(t('pal_nothing'))}</li>`;
  document.getElementById('palInput').setAttribute('aria-activedescendant', palItems.length ? 'po'+palIdx : '');
  document.querySelectorAll('#palList [data-h]').forEach((li) => li.onclick = () => { location.hash = li.dataset.h; document.getElementById('palette').close(); });
}
function openPalette(){ const p = document.getElementById('palette'); document.getElementById('palInput').value=''; palIdx=0; palRender(); p.showModal(); document.getElementById('palInput').focus(); }
document.getElementById('palInput').addEventListener('input', () => { palIdx=0; palRender(); });
document.getElementById('palInput').addEventListener('keydown', (e) => {
  if (e.key==='ArrowDown') { palIdx = Math.min(palItems.length-1, palIdx+1); palRender(); e.preventDefault(); }
  else if (e.key==='ArrowUp') { palIdx = Math.max(0, palIdx-1); palRender(); e.preventDefault(); }
  else if (e.key==='Enter' && palItems[palIdx]) { location.hash = palItems[palIdx].h; document.getElementById('palette').close(); }
});

/* ---------------- Global events ---------------- */
document.getElementById('openPalette').onclick = openPalette;
document.getElementById('inboxBtn').onclick = () => { location.hash = '#/inbox'; };
document.getElementById('langBtn').onclick = () => { lang = lang==='en' ? 'ru' : 'en'; render(); };
document.getElementById('themeBtn').onclick = () => { S.theme = S.theme==='system' ? 'light' : S.theme==='light' ? 'dark' : 'system'; if (S.theme==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme); renderBand(); };
document.getElementById('menuBtn').onclick = () => { const n = document.getElementById('sidenav'); n.style.top = document.querySelector('.band').offsetHeight + 'px'; const o = n.classList.toggle('open'); document.getElementById('menuBtn').setAttribute('aria-expanded', String(o)); if (o) { const a = n.querySelector('a'); if (a) a.focus(); } };
let gPending = false;
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='k') { e.preventDefault(); openPalette(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector('dialog[open]');
  if (typing || !S.shortcuts) return;
  if (gPending) { gPending = false; if (e.key==='o') location.hash='#/overview'; else if (e.key==='i') location.hash='#/inbox'; else if (e.key==='a') location.hash='#/audit'; return; }
  if (e.key==='g') { gPending = true; setTimeout(() => gPending=false, 1200); }
  else if (e.key==='?') location.hash = '#/help';
  else if (e.key==='/') { const f = document.querySelector('main .filterbar input, main input'); if (f) { e.preventDefault(); f.focus(); } }
});
window.addEventListener('hashchange', render);
window.matchMedia('(max-width: 767px)').addEventListener('change', renderBand);
render();
</script>
