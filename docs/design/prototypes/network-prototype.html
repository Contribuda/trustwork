<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub network prototype</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#14171c;--muted:#5a6270;--line:#d9dde4;--blue:#1f5fd6;--blue-ink:#0b3d91;--blue-soft:#e8f0fd;--green:#17703a;--green-soft:#e6f4ea;--amber:#8a5a00;--amber-soft:#fdf3dc;--red:#a1251b;--red-soft:#fbe9e7;--land:#dfe5ee;--sea:#f1f5fa;--focus:#ffbf00;--radius:8px;--lp-bg:var(--surface);--lp-ink:var(--ink);--lp-line:var(--line);--lp-accent:var(--blue)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--surface);padding:8px;z-index:10}.skip:focus{left:8px}
.proto-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 16px;background:#14171c;color:#fff;font-size:13px}
.proto-bar .seg{display:inline-flex;border:1px solid #556;border-radius:6px;overflow:hidden}
.proto-bar .seg button{background:transparent;border:0;color:#fff;padding:4px 10px;cursor:pointer}
.proto-bar .seg button[aria-pressed="true"]{background:#fff;color:#14171c}
.stage{padding:0}
.stage.phone{display:flex;justify-content:center;padding:16px}
.app{background:var(--bg);min-height:calc(100vh - 44px)}
.stage.phone .app{width:390px;min-height:780px;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.band{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;color:var(--ink)}
.mark{display:inline-grid;grid-template-columns:8px 8px;gap:2px}.mark i{width:8px;height:8px;background:var(--blue);display:block}.mark i:nth-child(3){grid-column:1}
.brand .stack{line-height:1;font-size:12px;text-transform:none}
.acts{color:var(--muted);font-size:13px}
.acts b{color:var(--ink)}
.band .spacer{flex:1}
.demo{background:var(--amber-soft);color:var(--amber);padding:6px 16px;font-size:13px;border-bottom:1px solid var(--line)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:600px}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:12px 8px}
nav.side h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:8px 8px}
nav.side ul{list-style:none;margin:0;padding:0}
nav.side a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
nav.side a[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
nav.side .count{font-size:12px;background:var(--line);border-radius:10px;padding:0 7px}
main{padding:16px 20px;min-width:0}
.stage.phone .layout,.compact .layout{grid-template-columns:1fr}
.stage.phone nav.side,.compact nav.side{border-right:0;border-bottom:1px solid var(--line);padding:8px}
.stage.phone nav.side h2{display:none}
.stage.phone nav.side ul{display:flex;overflow-x:auto;gap:4px}
.stage.phone nav.side a{white-space:nowrap}
.stage.phone main{padding:12px}
@media (max-width:720px){.layout{grid-template-columns:1fr}nav.side{border-right:0;border-bottom:1px solid var(--line)}nav.side h2{display:none}nav.side ul{display:flex;overflow-x:auto;gap:4px}nav.side a{white-space:nowrap}main{padding:12px}}
.crumb{font-size:13px;color:var(--muted);margin:0 0 4px}
h1{font-size:22px;margin:0 0 4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lede{color:var(--muted);margin:0 0 14px}
.status{font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px;border:1px solid currentColor}
.st-proposed{color:var(--amber)}.st-ok{color:var(--green)}.st-warn{color:var(--amber)}.st-bad{color:var(--red)}.st-info{color:var(--blue)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}
.toolbar label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:34px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;min-height:34px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;min-height:34px}
.seg2 button[aria-pressed="true"]{background:var(--blue);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 8px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stage.phone .grid2{grid-template-columns:1fr}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.mapwrap{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:none}
.mapctl{position:absolute;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,36px);gap:4px}
.mapctl button{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:4px}
.summary{font-size:13px;color:var(--muted);margin:6px 0 0}
table{width:100%;border-collapse:collapse;background:var(--surface)}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.tablewrap{border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
.cards-only{display:none}
.stage.phone .tablewrap.responsive table,.compact .tablewrap.responsive table{display:none}
.stage.phone .tablewrap.responsive .cards-only{display:block}
@media (max-width:720px){.tablewrap.responsive table{display:none}.tablewrap.responsive .cards-only{display:block}}
.rowcard{padding:10px;border-bottom:1px solid var(--line)}
.rowcard b{display:block}
.pill{display:inline-block;font-size:12px;border-radius:10px;padding:0 8px;border:1px solid var(--line);margin:0 4px 4px 0}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);padding:16px;overflow:auto;z-index:20}
.stage.phone .drawer{position:absolute}
.stage.phone .app{position:relative}
.drawer header{display:flex;justify-content:space-between;align-items:start;gap:8px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}
dl.facts dt{color:var(--muted);font-size:13px}
dl.facts dd{margin:0}
.src{font-size:11px;color:var(--muted);display:block}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{border-bottom-color:var(--blue);font-weight:600}
.setting{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.setting small{display:block;color:var(--muted)}
.locked{display:flex;gap:8px;align-items:start;padding:6px 0;font-size:14px}
.locked::before{content:"\1F512";font-size:12px}
.diff{width:100%}
.diff td.b{color:var(--red)}.diff td.a{color:var(--green)}
.effect{font-size:13px;color:var(--muted)}
.tag-w{color:var(--amber);font-weight:600;font-size:12px}.tag-n{color:var(--green);font-weight:600;font-size:12px}
.approval{border:2px solid var(--blue);border-radius:var(--radius);padding:14px;background:var(--blue-soft)}
.stepper{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 12px;flex-wrap:wrap}
.stepper li{font-size:13px;padding:4px 10px;border-radius:12px;border:1px solid var(--line)}
.stepper li[aria-current="step"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.thread{list-style:none;margin:0;padding:0}
.msg{border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:8px;background:var(--surface)}
.msg.out{border-left:4px solid var(--blue)}
.msg .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px}
.fields{font-size:13px;background:var(--bg);border-radius:6px;padding:6px 8px;margin:6px 0}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:8px;font-size:13px}
.ok{background:var(--green-soft);color:var(--green);border-radius:6px;padding:8px;font-size:13px}
.bad{background:var(--red-soft);color:var(--red);border-radius:6px;padding:8px;font-size:13px}
.bar{height:10px;background:var(--blue);border-radius:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{pointer-events:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14171c;color:#fff;padding:10px 14px;border-radius:8px;z-index:30;max-width:90%}
.grid2>*,.layout>*{min-width:0}.setting label{min-width:0;overflow-wrap:break-word}.card{overflow-wrap:break-word}.stage.phone .diff thead{display:none}.stage.phone .diff tr,.stage.phone .diff th,.stage.phone .diff td{display:block;border:0;padding:2px 0}.stage.phone .diff tr{border-bottom:1px solid var(--line);padding:8px 0}.stage.phone .diff td::before{content:attr(data-label) ": ";color:var(--muted);font-size:12px}
@media (max-width:720px){.diff thead{display:none}.diff tr,.diff th,.diff td{display:block;border:0;padding:2px 0}.diff tr{border-bottom:1px solid var(--line);padding:8px 0}.diff td::before{content:attr(data-label) ": ";color:var(--muted);font-size:12px}}.stage.phone .tablewrap{max-width:100%}

/* Language picker: inherits the header's colour; the menu uses --lp-bg / --lp-ink / --lp-line / --lp-accent */
.lp{position:relative;display:inline-block}
.lp-btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 10px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.lp-btn .lp-ico{flex:none;opacity:.85}
.lp-btn:focus-visible,.lp-opt:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.lp-pop{position:absolute;top:calc(100% + 6px);right:0;z-index:200;width:max-content;min-width:220px;max-width:calc(100vw - 32px);padding:6px;border-radius:10px;border:1px solid var(--lp-line,#d0d5dd);background:var(--lp-bg,#fff);color:var(--lp-ink,#14181f);box-shadow:0 10px 28px rgba(0,0,0,.18);text-align:left}
.lp-pop[hidden]{display:none}
.lp-opt{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;width:100%;min-height:36px;padding:6px 10px 6px 6px;border:0;border-radius:6px;background:transparent;color:inherit;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.lp-opt:hover{background:color-mix(in srgb,var(--lp-accent,#1f5fd6) 10%,transparent)}
.lp-opt[aria-pressed="true"]{font-weight:650}
.lp-check{display:inline-block;width:14px;flex:none;color:var(--lp-accent,#1f5fd6)}
.lp-note{flex-basis:100%;padding-left:22px;font-size:11.5px;font-weight:400;opacity:.75}

.proto-bar .lp-btn{border-color:#556}
@media(max-width:720px){.layout,.side{min-width:0}.side{max-width:100%;overflow-x:auto}.side ul{width:100%;max-width:100%}.side li,.side a{position:relative}.side a{white-space:nowrap}}
@media(max-width:720px){dl.facts{grid-template-columns:minmax(0,1fr)}dl.facts dd{margin:0;overflow-wrap:anywhere}.grid2>*{min-width:0}}
@media(max-width:720px){.traffic-table{table-layout:fixed}.traffic-table th,.traffic-table td{overflow-wrap:anywhere}}
</style>

 if(d.peertab){S.peerTab=d.peertab;render(`[data-peertab="${d.peertab}"]`);return;}

 if(d.hub){S._return=d.hub;S.drawer=d.hub;render("drawer");return;}
 if(d.cluster){const [x,y]=d.cluster.split(",").map(Number);S.cx=(x-W/2)/S.zoom+S.cx;S.cy=(y-Hh/2)/S.zoom+S.cy;S.zoom=Math.min(8,S.zoom*2.5);render();announce(summaryLine());return;}
 if(d.close!==undefined&&el.hasAttribute("data-close")){S.drawer=null;render(S._return?`[data-hub="${S._return}"]`:"h1");return;}
 if(d.pan){const step=120/S.zoom;if(d.pan==="up")S.cy-=step;if(d.pan==="down")S.cy+=step;if(d.pan==="left")S.cx-=step;if(d.pan==="right")S.cx+=step;render(`[data-pan="${d.pan}"]`);announce(summaryLine());return;}
 if(d.zoom){if(d.zoom==="in")S.zoom=Math.min(8,S.zoom*1.6);if(d.zoom==="out")S.zoom=Math.max(1,S.zoom/1.6);if(d.zoom==="reset"){S.zoom=1;S.cx=500;S.cy=250;}render(`[data-zoom="${d.zoom}"]`);announce(summaryLine());return;}
 if(d.goRequest){go("request",{reqHub:d.goRequest,reqStep:1});return;}
 if(d.openPeer){if(d.openPeer!=="bajio"){S.peer=d.openPeer;}else S.peer="bajio";go("peer",{peerTab:d.openPeer==="bajio"?"settings":"overview"});return;}
 if(d.step){S.reqStep=Number(d.step);render("h1");return;}
 if(el.hasAttribute("data-send-request")){if(!$("#rreason").value.trim()){toast(t("needReason"));$("#rreason").focus();return;}hub(S.reqHub).status="reqout";S.reqStep=4;render("h1");announce(t("reqSent"));return;}
 if(d.accept){hub(d.accept).status="peer";hub(d.accept).level="syndicate";hub(d.accept).trust="new";hub(d.accept).reach="ok";hub(d.accept).tomb="-";toast(t("acceptedToast"));render();return;}
 if(d.decline){hub(d.decline).status="listed";toast(t("declinedToast"));render();return;}
 if(el.hasAttribute("data-request-act")){const r=$("#reason").value.trim();if(!r){toast(t("needReason"));$("#reason").focus();return;}S.pending={diffs:diffs(),digest:digestOf(),reason:r};render("#aph");announce(t("approvalTitle"));return;}
 if(el.hasAttribute("data-protective")){const r=$("#reason").value.trim();if(!r){toast(t("needReason"));$("#reason").focus();return;}S.settingsVersion++;S.active=JSON.parse(JSON.stringify(S.draft));S.activity.push({d:"2026-11-01",k:"actNew",vars:{v:S.settingsVersion,how:"howProtective"}});toast(t("protectiveDone",{v:S.settingsVersion}));render("h1");return;}
 if(el.hasAttribute("data-switch-approver")){S.approver=true;render("[data-approve]");return;}
 if(el.hasAttribute("data-approve")){S.settingsVersion++;S.active=JSON.parse(JSON.stringify(S.draft));S.pending=null;S.activity.push({d:"2026-11-01",k:"actNew",vars:{v:S.settingsVersion,how:"howApproved"}});S.approver=false;toast(t("activated",{v:S.settingsVersion}));render("h1");return;}
 if(el.hasAttribute("data-decline-req")){S.pending=null;S.draft=JSON.parse(JSON.stringify(S.active));S.approver=false;toast(t("declinedToast"));render("h1");return;}
 if(el.hasAttribute("data-suspend")){confirmBox(t("suspendQ",{h:hub(S.peer).name}),false,()=>{hub(S.peer).status="suspended";S.activity.push({d:"2026-11-01",k:"actSusp"});toast(t("suspendedToast"));render("h1");});return;}
 if(el.hasAttribute("data-defed")){confirmBox(t("defedQ",{h:hub(S.peer).name}),true,()=>{const h=hub(S.peer);h.status="former";h.ended="2026-11-01";S.activity.push({d:"2026-11-01",k:"actDefed"});toast(t("defedToast",{r:fmtNum(1834),d:fmtNum(3)}));go("peers",{peersTab:"former"});});return;}
 if(d.thread){S.thread=d.thread;render("h1");return;}
 if(el.hasAttribute("data-actioned")){THREADS.find(x=>x.id===S.thread).state="actioned";render();return;}
 if(el.hasAttribute("data-send-msg")){const b=$("#mbody").value.trim();if(!b)return;THREADS.find(x=>x.id===S.thread).msgs.push({dir:"out",when:new Date().toISOString(),role:null,fields:$("#mtarget").value?[["target",$("#mtarget").value]]:[],body:b,lang:L10N.lang});toast(t("sent"));render();return;}
 if(el.hasAttribute("data-ack")){S.annAck=true;render("h1");return;}
 if(el.hasAttribute("data-updates")){toast(t("opsOutside"));return;}
 if(el.hasAttribute("data-submit-dir")){toast(t("submittedDir"));return;}
});
function confirmBox(text,typed,onOk){const trigger=document.activeElement;const slot=$("#confirmSlot");const name=hub(S.peer).name;
 slot.innerHTML=`<div class="card" role="alertdialog" aria-labelledby="cq"><p id="cq">${esc(text)}</p>${typed?`<p><label for="cname">${t("typeName")}</label><br><input id="cname" type="text" style="width:100%" autocomplete="off"></p>`:""}<p><label for="creason">${t("reason")}</label><br><textarea id="creason" rows="2" style="width:100%"></textarea></p><div class="inline"><button class="btn" id="ccancel">${t("cancel")}</button><button class="btn danger" id="cok">${t("confirm")}</button></div></div>`;
 $("#ccancel").focus();
 const cancel=()=>{slot.innerHTML="";trigger?.focus();};
 $("#ccancel").onclick=cancel;
 slot.onkeydown=e=>{if(e.key==="Escape"){e.stopPropagation();cancel();}};
 $("#cok").onclick=()=>{if(!$("#creason").value.trim()){toast(t("needReason"));$("#creason").focus();return;}if(typed&&$("#cname").value.trim()!==name){$("#cname").setAttribute("aria-invalid","true");toast(t("typeName")+": "+name);$("#cname").focus();return;}onOk();};}
document.addEventListener("change",e=>{const el=e.target;
 if(el.dataset.filter!==undefined){S.filters[el.dataset.filter]=el.value;render(`[data-filter="${el.dataset.filter}"]`);announce(S.mapMode==="map"?summaryLine():"");return;}
 if(el.dataset.set){const k=el.dataset.set;if(k==="listingOn"){S.listing=el.checked;render("#listingOn");return;}let v=el.type==="checkbox"?el.checked:el.type==="number"?Math.max(0,Math.min(Number(el.max)||1e9,Number(el.value)||0)):el.value;
  if(k==="level"&&LEVELS.indexOf(v)<2){S.draft.commerce=false;RQ.forEach(r=>S.draft.rq[r].on=false);}
  setDeep(S.draft,k,v);render(`[data-set="${k}"]`);return;}
 if(el.dataset.pv!==undefined){S.peerVis=el.value;render("[data-pv]");return;}
 if(el.dataset.pub){S.pub[el.dataset.pub]=el.checked;return;}
 if(el.hasAttribute("data-reqlevel")){S.reqLevel=el.value;return;}
});
document.addEventListener("input",e=>{if(e.target.id==="mbody"){const w=$("#mwarn");w.innerHTML=/[\w.+-]+@[\w-]+\.[\w.]+|\+?\d[\d\s().-]{7,}\d/.test(e.target.value)?`<p class="warn">${t("piiWarn")}</p>`:"";}});
document.addEventListener("keydown",e=>{
 const mk=e.target.closest&&e.target.closest(".mk");
 if(mk&&(e.key==="Enter"||e.key===" ")){e.preventDefault();mk.dispatchEvent(new MouseEvent("click",{bubbles:true}));return;}
 if(e.key==="Escape"&&S.drawer){S.drawer=null;render(S._return?`[data-hub="${S._return}"]`:"h1");return;}
 if(e.target.id==="mapwrap"&&["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){e.preventDefault();const step=120/S.zoom;if(e.key==="ArrowUp")S.cy-=step;if(e.key==="ArrowDown")S.cy+=step;if(e.key==="ArrowLeft")S.cx-=step;if(e.key==="ArrowRight")S.cx+=step;render("#mapwrap");announce(summaryLine());}
});
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(v&&v!==S.view&&["map","peers","peer","request","messages","announcements","stats","listing"].includes(v)){S.view=v;S.drawer=null;render("h1");}});
L10N.mount(document.getElementById("langPicker"));
L10N.onChange(()=>render());
(function init(){const v=location.hash.slice(1);if(["map","peers","peer","request","messages","announcements","stats","listing"].includes(v))S.view=v;if(window.matchMedia&&matchMedia("(max-width:720px)").matches)S.mapMode="list";render();})();
</script>
</body>
</html>
