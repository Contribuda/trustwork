# Checks the pull request description against .github/PULL_REQUEST_TEMPLATE.md: what and why, verification evidence
# (npm run check ticked, commit SHA, results), the AI agent box with an Agent line, the DCO box, and a reference to the
# work package whose paths the pull request changes. Draft pull requests get warnings only. Commit sign-off itself is
# checked by the "DCO sign-off" job in check.yml. Read-only; it never comments or labels.
name: pull request
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    name: PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # On `edited` events the base and head in the payload can be commits the checkout did not fetch (the base branch
      # moved, or checkout fetched only the pull request ref); fetch both by SHA so the changed-file diff always works.
      - name: Fetch the base and head commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA"
      - name: Check the description
        run: node scripts/claims.mjs pr --event "$GITHUB_EVENT_PATH"
