name: check
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: trustwork_dev
          POSTGRES_USER: trustwork_dev
          POSTGRES_PASSWORD: local_only_change_me
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trustwork_dev -d trustwork_dev"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TRUSTWORK_TEST_PG_BACKEND: external
      TRUSTWORK_TEST_DATABASE_URL: postgresql://trustwork_dev:local_only_change_me@localhost:5432/trustwork_dev
      # Database suites fail instead of skipping when PostgreSQL is missing (tests/data/helpers/postgres.ts).
      TRUSTWORK_REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run check
      - name: OpenAPI document matches the contracts
        run: node scripts/ci/openapi-drift.mjs
      - name: npm run check leaves a clean checkout clean
        run: node scripts/ci/assert-clean-tree.mjs "npm run check or the OpenAPI generator changed tracked files"

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pull requests that cannot change the web app skip the suite (scripts/ci/affected.mjs); pushes to main and
      # merge-queue groups always run it, so nothing reaches main untested.
      - name: Which suites this change affects
        id: affected
        run: node scripts/ci/affected.mjs "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.affected.outputs.web == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
        if: steps.affected.outputs.web == 'true'
      - run: npm ci
        if: steps.affected.outputs.web == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.affected.outputs.web == 'true'
        working-directory: apps/web
      - run: NEXT_DIST_DIR=.next-e2e npx next build --webpack
        if: steps.affected.outputs.web == 'true'
        working-directory: apps/web
      - name: Client bundle-size budget
        if: steps.affected.outputs.web == 'true'
        run: node scripts/ci/bundle-budget.mjs apps/web/.next-e2e
      - run: NEXT_DIST_DIR=.next-e2e TRUSTWORK_E2E_PORT=3459 npx playwright test
        if: steps.affected.outputs.web == 'true'
        working-directory: apps/web
      - name: The browser build leaves a clean checkout clean
        if: steps.affected.outputs.web == 'true'
        run: node scripts/ci/assert-clean-tree.mjs "the web build or browser tests changed tracked files"

  design-system:
    name: design-system accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pull requests that cannot change the web app skip the suite (scripts/ci/affected.mjs); pushes to main and
      # merge-queue groups always run it, so nothing reaches main untested.
      - name: Which suites this change affects
        id: affected
        run: node scripts/ci/affected.mjs "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.affected.outputs.ui == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
        if: steps.affected.outputs.ui == 'true'
      - run: npm ci
        if: steps.affected.outputs.ui == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.affected.outputs.ui == 'true'
        working-directory: packages/ui
      # Storybook build, then axe-core (WCAG A/AA tags) over every story plus keyboard, contrast and mobile specs.
      - run: npm run test:a11y -w @trustwork/ui
        if: steps.affected.outputs.ui == 'true'
      - name: The Storybook build leaves a clean checkout clean
        if: steps.affected.outputs.ui == 'true'
        run: node scripts/ci/assert-clean-tree.mjs "the design-system suite changed tracked files"

  dependencies:
    name: dependency audit and licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.16.0
      # Both read package-lock.json only; no install is needed. Development tooling advisories are reported
      # separately (docs/quality/validation.md) and do not fail the build.
      - name: npm audit (runtime dependencies, fail on high)
        run: npm audit --omit=dev --audit-level=high
      - name: Licence allowlist (scripts/ci/license-policy.json)
        run: node scripts/ci/licenses.mjs

  live-browser:
    # WEB-004: the web app with demo mode off against the real API and a migrated database (tests/web/live-api).
    name: live API browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: trustwork_dev
          POSTGRES_USER: trustwork_dev
          POSTGRES_PASSWORD: local_only_change_me
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trustwork_dev -d trustwork_dev"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TRUSTWORK_TEST_PG_BACKEND: external
      TRUSTWORK_TEST_DATABASE_URL: postgresql://trustwork_dev:local_only_change_me@localhost:5432/trustwork_dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: NEXT_DIST_DIR=.next-live TRUSTWORK_API_ORIGIN=http://127.0.0.1:3471 npx next build --webpack
        working-directory: apps/web
      - run: NEXT_DIST_DIR=.next-live npx playwright test -c ../../tests/web/live-api/playwright.config.ts
        working-directory: apps/web

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # A merge-queue group checks the commits it adds on top of main.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            # Dependabot's own version-bump commits cannot sign off; a maintainer reviews and merges them.
            if { [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ -z "$PR_AUTHOR" ]; } && [ "$(git log -1 --format=%ae "$sha")" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then
              continue
            fi
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $sha has no Signed-off-by line (git commit -s)"; missing=1
            fi
          done
          exit $missing

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gitleaks 8.30.1 (download verified against the release checksum)
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_checksums.txt
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
