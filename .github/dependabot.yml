# Weekly dependency updates. Pins stay exact (.npmrc save-exact); every update is a pull request that runs the
# full check workflow (database tests, browser and accessibility suites, audit, licences) before a maintainer
# reviews it. Minor and patch updates are grouped to keep the queue short; majors arrive one per pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
